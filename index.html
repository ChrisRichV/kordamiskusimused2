function barRow(label,qs,attr){const n=qs.length;let y=0,p=0,w=0;qs.forEach(q=>{const l=st(q.id).last;if(l==="yes")y++;else if(l==="part")p++;else if(l==="no")w++});
  const pc=Math.round((y+p*.5)/n*100);
  return `<button class="barrow" ${attr} type="button"><span class="lbl" title="${esc(label)}">${esc(label)}</span><span class="trk"><i style="width:0;background:var(--ok)" data-w="${y/n*100}%"></i><i style="width:0;background:var(--warn)" data-w="${p/n*100}%"></i><i style="width:0;background:var(--bad)" data-w="${w/n*100}%"></i></span><span class="pct">${pc}%</span></button>`}

/* ---------- picker sheets ---------- */
function sheet(html){const s=document.createElement("div");s.className="scrim";s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  s.addEventListener("click",e=>{if(e.target===s)s.remove()});document.body.appendChild(s);
  const esch=e=>{if(e.key==="Escape"){s.remove();removeEventListener("keydown",esch)}};addEventListener("keydown",esch);
  s.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>s.remove());return s}
function openPicker(key){const t=TOP[key];let sel=null;
  const s=sheet(`<button class="iconbtn close" data-close aria-label="Sulge">✕</button><div class="tl" style="font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Teema</div><h2>${esc(t.title)}</h2>
  <div class="grp"><div class="lab">Vali osa</div><div class="chips" id="subchips"><button class="chip" aria-pressed="true" data-si="">Kogu teema (${QS.filter(q=>q.t===key).length})</button>${t.subs.map((x,i)=>`<button class="chip" aria-pressed="false" data-si="${i}">${esc(x.name)} (${x.questions.length})</button>`).join("")}</div></div>
  <div class="grp"><div class="lab">Õppimisrežiim</div>${modesHTML()}</div>`);
  s.querySelectorAll("#subchips .chip").forEach(c=>c.onclick=()=>{s.querySelectorAll("#subchips .chip").forEach(x=>x.setAttribute("aria-pressed","false"));c.setAttribute("aria-pressed","true");sel=c.dataset.si===""?null:+c.dataset.si});
  s.querySelectorAll(".mode").forEach(m=>m.onclick=()=>{const qs=QS.filter(q=>q.t===key&&(sel==null||q.si===sel));s.remove();start(m.dataset.mode,qs,sel==null?t.short:t.subs[sel].name)})}
function modesHTML(){return `<div class="modes">
  <button class="mode" data-mode="flash">${svg(MODE_IC.flash,"mi")}<b>Mälukaardid</b><span>Pööra, pühi ja hinda ennast</span></button>

function openModes(qs,label){if(!qs.length){toast("Siin pole veel küsimusi");return}
  const s=sheet(`<button class="iconbtn close" data-close aria-label="Sulge">✕</button><h2>${esc(label)}</h2><p class="muted">${qs.length} küsimust</p><div class="grp"><div class="lab">Õppimisrežiim</div>${modesHTML()}</div>`);
  s.querySelectorAll(".mode").forEach(m=>m.onclick=()=>{s.remove();start(m.dataset.mode,qs,label)})}

/* ---------- rating & XP ---------- */
function rate(id,r,silent){const s=S.q[id]||(S.q[id]={r:0,p:0,w:0,last:null});
  if(r==="yes")s.r++;else if(r==="part")s.p++;else s.w++;s.last=r;s.ts=Date.now();
  S.days[today()]=(S.days[today()]||0)+1;
  let gain=0;if(session){if(r==="yes"){session.combo++;session.maxCombo=Math.max(session.maxCombo,session.combo)}else session.combo=0;
    gain=r==="yes"?10+Math.min(10,Math.floor(session.combo/3)*2):r==="part"?4:0;session.xp+=gain;session.res[r]++;if(r!=="yes")session.wrong.add(id);}
  pushAnswer(id,r);const before=levelOf(S.xp);S.xp+=gain;save();
  if(gain&&!silent){const f=$("#flash");f.className="flash";void f.offsetWidth;if(r==="yes")f.className="flash g";floatXP(gain)}
  if(levelOf(S.xp)>before)levelUp(levelOf(S.xp));
  return gain}
function floatXP(n){const d=document.createElement("div");d.className="xpfloat";d.textContent="+"+n+" XP";d.style.left="50%";d.style.top="38%";document.body.appendChild(d);setTimeout(()=>d.remove(),720)}
function levelUp(i){confetti();const d=document.createElement("div");d.className="lvlup";d.innerHTML=`<span class="muted">Uus tase</span><b>${LEVELS[i][1]}</b>`;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=$("#confetti");c.hidden=false;const ctx=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#e0b33e","#2457c5","#1c7a3e","#c0266e","#6d35d6","#b93f0d"];const P=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:Math.random()*-12-3,s:4+Math.random()*6,c:cols[Math.random()*cols.length|0],r:Math.random()*6}));
  let t0=performance.now();(function f(t){const k=(t-t0)/1000;ctx.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.r+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,1-k/1.4);ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore()});if(k<1.4)requestAnimationFrame(f);else{ctx.clearRect(0,0,c.width,c.height);c.hidden=true}})(t0)}

/* ---------- session ---------- */
function order(qs){const g={no:[],un:[],part:[],yes:[]};qs.forEach(q=>{const l=st(q.id).last;(l==="no"?g.no:l==="part"?g.part:l==="yes"?g.yes:g.un).push(q)});return [...shuffle(g.no),...shuffle(g.un),...shuffle(g.part),...shuffle(g.yes)]}
function start(mode,qs,label){session={mode,label,pool:qs.slice(),queue:mode==="flash"?order(qs):shuffle(qs),idx:0,res:{yes:0,part:0,no:0},wrong:new Set(),xp:0,combo:0,maxCombo:0,re:{},done:false};
  if(current!=="opi")go("opi");else renderSession()}
function endSession(abort){if(session&&session.timer)cancelAnimationFrame(session.timer);session=null;if(abort)renderHome()}
function renderSession(){const s=session;if(s.done)return renderSummary();
  if(s.mode==="flash")return renderFlash();if(s.mode==="write")return renderWrite();if(s.mode==="speed")return renderSpeed();return renderMatch()}
function sbar(){const s=session;const tot=s.queue.length;return `<div class="sbar"><button class="iconbtn" id="quit" aria-label="Lõpeta">✕</button><div class="prog"><i style="width:${Math.min(100,s.idx/tot*100)}%"></i></div><span class="combo ${s.combo>=3?"hot":""}">🔥${s.combo}</span><span class="xpchip">+${s.xp}</span></div>`}
function bindQuit(){$("#quit").onclick=()=>{if(session.idx>0||session.mode==="match"){session.done=true;if(session.timer)cancelAnimationFrame(session.timer);renderSummary()}else endSession(true)}}
function fontCls(q){const n=q.variants.join(" ").length;return n>480?"xs":n>260?"s":""}
function reportBtn(id){return `<button class="btn small ghost" data-report="${id}">✎ Paku parandust</button>`}
function bindReports(el){el.querySelectorAll("[data-report]").forEach(b=>b.onclick=e=>{e.stopPropagation();openReport(b.dataset.report)})}
function openReport(id){const q=BY[id];const s=sheet(`<button class="iconbtn close" data-close aria-label="Sulge">✕</button><h2>Paku parandust</h2><p class="muted" style="margin:.4rem 0 0">${esc(TOP[q.t].short)} · ${q.num}. ${esc(q.q)}</p>
  <div class="fld"><label class="lbl2" for="fxName">Sinu nimi</label><input id="fxName" autocomplete="name" value="${esc(S.user?S.user.name:(S.name||""))}" placeholder="Näiteks Chris"></div>

  <p class="src" style="margin:10px 0 0">${REMOTE.on?"Parandus saadetakse ühisesse andmebaasi ja on kohe kõigile näha vana vastuse all.":"Parandus salvestub selles brauseris ja ilmub vana vastuse alla. Lehel „Muudatused“ saad selle kopeerida ja edasi saata."}</p>
  <div style="display:flex;gap:10px;margin-top:12px;justify-content:flex-end"><button class="btn ghost" data-close>Tühista</button><button class="btn primary" id="fxSave">Salvesta parandus</button></div>`);
  $("#fxText",s).focus();$("#fxSave",s).onclick=()=>{const name=$("#fxName",s).value.trim(),text=$("#fxText",s).value.trim(),note=$("#fxNote",s).value.trim();
    if(!name){$("#fxName",s).focus();toast("Lisa oma nimi");return}if(!text||text===q.a){$("#fxText",s).focus();toast("Muuda vastust");return}

    const done=msg=>{s.remove();toast(msg);rerender();if(session&&session.mode==="flash"){}};
    if(REMOTE.on){sendRemote(f).then(rid=>{(q.community=q.community||[]).push({rid,name,text,note,status:"kinnitamata",ts:new Date().toISOString()});done("Parandus saadetud ja kõigile näha")})
      .catch(()=>{S.fixes.push(f);save();done("Ei saanud saata, parandus jäi sinu seadmesse")})}
    else{S.fixes.push(f);save();done("Parandus salvestatud sinu seadmesse")}}}

/* flashcards */
function renderFlash(){const s=session,el=$("#page-opi");if(s.idx>=s.queue.length){s.done=true;return renderSummary()}
  const q=s.queue[s.idx],t=TOP[q.t];
  el.innerHTML=`<div class="sess">${sbar()}
  <div class="stage" id="stage"><div class="fc" id="fc" style="--tc:${t.color}" tabindex="0" aria-label="Kaart, vajuta tühikut pööramiseks"><div class="inner">
    <div class="face front"><div class="tl"><span><i class="dot"></i>${esc(t.short)} · ${esc(q.sub)}</span><span class="mono">${s.idx+1}/${s.queue.length}</span></div>${isPic(q)?imgTag(q):""}<div class="qtext">${esc(q.q)}</div><div class="tap">Puuduta, et näha vastust</div></div>
    <div class="face back"><div class="tl"><span><i class="dot"></i>${q.num>100?"Pildiküsimus":q.num+". küsimus"}</span>${badge(q,false)}</div><div class="qsmall">${esc(q.q)}</div><div class="abody ${fontCls(q)}">${isPic(q)?"":imgTag(q)}${ansHTML(q)}${peopleHTML(q)}${cfixHTML(q)}${q.status==="fix"?`<details style="margin-top:10px"><summary class="src" style="cursor:pointer">Mis muutus?</summary>${diffHTML(q)}</details>`:""}</div><div class="afoot"><span class="src">${q.src?esc(q.src):esc(q.note||"")}</span>${reportBtn(q.id)}</div></div>
  </div><div class="tint" id="tint"></div></div></div>
  <div class="rates"><button class="rate r-no" data-r="no">Ei teadnud<small>← vasakule</small></button><button class="rate r-part" data-r="part">Osaliselt<small>↑ üles</small></button><button class="rate r-yes" data-r="yes">Teadsin<small>paremale →</small></button></div>
  <div class="hint">Tühik pöörab kaardi, nooled hindavad.</div></div>`;
  bindQuit();bindReports(el);
  const fc=$("#fc"),tint=$("#tint");let flipped=false;
  const ab=$("#fc .back .abody");if(ab&&ab.scrollHeight>ab.clientHeight+4){ab.classList.add("more");ab.insertAdjacentHTML("afterend",'<div class="scrollhint">↓ keri vastust</div>');ab.addEventListener("scroll",()=>ab.classList.toggle("end",ab.scrollTop+ab.clientHeight>=ab.scrollHeight-4))}
  const flip=()=>{flipped=!flipped;fc.classList.toggle("flipped",flipped)};
  el.querySelectorAll(".rate").forEach(b=>b.onclick=()=>answer(b.dataset.r));
  let sx=0,sy=0,dx=0,dy=0,down=false,moved=false,zone=false;
  const reset=()=>{down=false;fc.classList.remove("drag");fc.style.transform="";tint.style.opacity=0};
  fc.addEventListener("pointerdown",e=>{if(e.target.closest("button,summary,details"))return;down=true;moved=false;sx=e.clientX;sy=e.clientY;dx=dy=0;
    zone=flipped&&!!e.target.closest(".abody")&&ab&&ab.scrollHeight>ab.clientHeight+4;fc.classList.add("drag");if(!zone)fc.setPointerCapture(e.pointerId)});
  fc.addEventListener("pointermove",e=>{if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>8)moved=true;
    if(zone&&moved&&Math.abs(dy)>=Math.abs(dx)){moved=true;reset();return}
    fc.style.transform=`translate(${dx}px,${Math.min(dy,40)}px) rotate(${dx/18}deg)`;
    const dir=Math.abs(dx)>Math.abs(dy)?(dx>0?"yes":"no"):(dy<0?"part":null);const a=Math.min(1,Math.max(Math.abs(dx),-dy)/140);
    tint.style.opacity=dir?a*.85:0;tint.style.background=dir==="yes"?"var(--ok)":dir==="no"?"var(--bad)":"var(--warn)";tint.textContent=dir==="yes"?"Teadsin":dir==="no"?"Ei teadnud":dir?"Osaliselt":""});
  const up=e=>{if(!down)return;down=false;fc.classList.remove("drag");
    if(dx>90)return answer("yes");if(dx<-90)return answer("no");if(!zone&&dy<-80&&Math.abs(dx)<90)return answer("part");
    fc.style.transform="";tint.style.opacity=0;if(!moved&&!e.target.closest("button,summary,details,a"))flip()};
  fc.addEventListener("pointerup",up);fc.addEventListener("pointercancel",reset);
  s.key=e=>{if(e.target.matches("textarea,input"))return;if(e.code==="Space"){e.preventDefault();flip()}else if(e.key==="ArrowRight")answer("yes");else if(e.key==="ArrowLeft")answer("no");else if(e.key==="ArrowUp"){e.preventDefault();answer("part")}};
  let busy=false;
  function answer(r){if(busy)return;busy=true;rate(q.id,r);
    if(r!=="yes"){const n=s.re[q.id]||0;if(n<2){s.re[q.id]=n+1;const pos=Math.min(s.queue.length,s.idx+(r==="no"?4:8));s.queue.splice(pos,0,q)}}
    const tx=r==="yes"?"120vw":r==="no"?"-120vw":"0",ty=r==="part"?"-110vh":"0";fc.classList.add("fly");fc.style.transform=`translate(${tx},${ty}) rotate(${r==="yes"?18:r==="no"?-18:0}deg)`;fc.style.opacity=".2";
    setTimeout(()=>{s.idx++;renderFlash()},240)}
}
addEventListener("keydown",e=>{if(session&&session.key&&current==="opi"&&!document.querySelector(".scrim"))session.key(e)});

/* write */
function renderWrite(){const s=session,el=$("#page-opi");s.key=null;if(s.idx>=s.queue.length){s.done=true;return renderSummary()}
  const q=s.queue[s.idx],t=TOP[q.t];
  el.innerHTML=`<div class="sess">${sbar()}<div class="panel wcard"><div class="tl src" style="font-weight:700;text-transform:uppercase;letter-spacing:.05em"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${t.color};margin-right:6px"></span>${esc(t.short)} · ${esc(q.sub)}</div>
  ${isPic(q)?imgTag(q):""}<div class="qtext">${esc(q.q)}</div><label for="wIn" class="src">Sinu vastus</label><textarea id="wIn" placeholder="Kirjuta vastus oma sõnadega…"></textarea>
  <div style="display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap"><button class="btn ghost" id="wSkip">Ei tea, näita vastust</button><button class="btn primary" id="wCheck">Kontrolli</button></div><div id="wRes"></div></div><div class="hint">Ctrl + Enter kontrollib vastuse.</div></div>`;
  bindQuit();const inp=$("#wIn");inp.focus({preventScroll:true});
  const check=skip=>{const u=skip?"":inp.value;const kws=q.kw.length?q.kw:[];const hits=kws.filter(k=>kwHit(u,k));const miss=kws.filter(k=>!hits.includes(k));
    const ratio=kws.length?hits.length/kws.length:0;let r=skip?"no":!kws.length?null:ratio===1?"yes":ratio>=.5?"part":"no";
    const ah=q.variants.length>1?q.variants.map((v,i)=>`<span class="var"><span class="varlbl">Vastus ${i+1}</span>${hlHM(v,hits,miss)}</span>`).join(""):hlHM(q.a,hits,miss);
    $("#wRes").innerHTML=`<div class="cmp" style="margin-top:6px"><div><h4>Sinu vastus</h4><div class="ans">${u?esc(u):'<span class="muted">(tühi)</span>'}</div></div><div><h4>Õige vastus ${badge(q,false)}</h4><div class="ans">${ah}</div>${peopleHTML(q)}${q.status==="fix"?`<details style="margin-top:8px"><summary class="src" style="cursor:pointer">Mis muutus?</summary>${diffHTML(q)}</details>`:""}</div></div>
    ${kws.length?`<div style="margin-top:12px" class="score">Tabasid ${hits.length}/${kws.length} märksõna</div><div class="kwchips" style="margin-top:6px">${hits.map(k=>`<mark class="hit">✓ ${esc(k)}</mark>`).join("")}${miss.map(k=>`<mark class="miss">✕ ${esc(k)}</mark>`).join("")}</div>`:""}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:space-between">${r===null?`<span class="src">Hinda ise:</span><span style="display:flex;gap:8px"><button class="btn small r-no" data-self="no">Ei</button><button class="btn small r-part" data-self="part">Osaliselt</button><button class="btn small r-yes" data-self="yes">Jah</button></span>`:`<span style="display:flex;gap:8px;flex-wrap:wrap">${r!=="yes"?`<button class="btn small ghost" id="wOverride">Loe siiski õigeks</button>`:""}${reportBtn(q.id)}</span><button class="btn primary" id="wNext">Järgmine →</button>`}</div>`;
    $("#wCheck").disabled=true;$("#wSkip").disabled=true;inp.readOnly=true;bindReports(el);
    const next=()=>{s.idx++;renderWrite()};
    if(r!==null){rate(q.id,r);if(r!=="yes"){const el2=$("#wRes");el2.classList.add("shake")}
      $("#wNext").onclick=next;const ov=$("#wOverride");if(ov)ov.onclick=()=>{fixLast(q.id,r);next()};$("#wNext").focus()}

function hlHM(text,hits,miss){const rs=ranges(text,[...hits,...miss],i=>i<hits.length?"hit":"miss");let h="",p=0;rs.forEach(([a,b,c])=>{h+=esc(text.slice(p,a))+`<mark class="${c}">`+esc(text.slice(a,b))+"</mark>";p=b});return h+esc(text.slice(p))}
function fixLast(id,r){const s=S.q[id];if(!s)return;if(r==="part")s.p--;else s.w--;s.r++;s.last="yes";if(session){session.res[r]--;session.res.yes++;session.wrong.delete(id);const g=10;session.xp+=g;S.xp+=g}save()}

/* speed */
function distractors(q,n){const pool=QS.filter(x=>x.id!==q.id&&!CLUSTER[q.id].has(x.id)&&shortAns(x)!==shortAns(q)&&(isPic(q)===isPic(x)||!isPic(q)||x.t===q.t));
  const same=shuffle(pool.filter(x=>x.t===q.t&&x.si===q.si)),topic=shuffle(pool.filter(x=>x.t===q.t&&x.si!==q.si)),other=shuffle(pool.filter(x=>x.t!==q.t));
  const out=[];const seen=new Set([shortAns(q).toLowerCase()]);for(const x of [...same,...topic,...other]){const a=shortAns(x);if(seen.has(a.toLowerCase()))continue;seen.add(a.toLowerCase());out.push(x);if(out.length>=n)break}return out}
function renderSpeed(){const s=session,el=$("#page-opi");s.key=null;
  if(!s.t0){s.t0=performance.now();s.dur=60000;s.queue=shuffle(s.pool);while(s.queue.length<80)s.queue=s.queue.concat(shuffle(s.pool));}
  const q=s.queue[s.idx%s.queue.length];const opts=shuffle([q,...distractors(q,3)]);
  el.innerHTML=`<div class="sess"><div class="sbar"><button class="iconbtn" id="quit" aria-label="Lõpeta">✕</button><span class="mono" id="secs" style="flex:1">60 s</span><span class="combo ${s.combo>=3?"hot":""}">🔥${s.combo}</span><span class="xpchip">✓ ${s.res.yes}</span></div>
  <div class="timer" id="timer"><i id="tbar" style="width:100%"></i></div>
  <div class="panel bigq"><div class="src" style="font-weight:700">${esc(TOP[q.t].short)}</div><div class="qtext">${esc(q.q)}</div>${isPic(q)?imgTag(q):""}</div>
  <div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}">${esc(shortAns(o))}</button>`).join("")}</div>
  <div class="hint">Rekord: ${S.best} õiget</div></div>`;
  bindQuit();
  const tick=()=>{const left=Math.max(0,s.dur-(performance.now()-s.t0));const tb=$("#tbar");if(!tb)return;tb.style.width=(left/s.dur*100)+"%";$("#timer").classList.toggle("low",left<10000);$("#secs").textContent=Math.ceil(left/1000)+" s";
    if(left<=0){s.done=true;renderSummary();return}s.timer=requestAnimationFrame(tick)};
  cancelAnimationFrame(s.timer);s.timer=requestAnimationFrame(tick);
  let locked=false;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const ok=b.dataset.id===q.id;
    rate(q.id,ok?"yes":"no");
    if(ok){b.classList.add("right");setTimeout(()=>{s.idx++;if(!s.done)renderSpeed()},220)}
    else{b.classList.add("wrong","shake");el.querySelector(`.opt[data-id="${q.id}"]`).classList.add("right");setTimeout(()=>{s.idx++;if(!s.done)renderSpeed()},850)}})}

/* match */
function renderMatch(){const s=session,el=$("#page-opi");s.key=null;
  if(!s.round){let pick=[];const used=new Set();for(const q of shuffle(s.pool)){const a=shortAns(q).toLowerCase();if(used.has(a)||pick.some(p=>CLUSTER[p.id].has(q.id)))continue;used.add(a);pick.push(q);if(pick.length===6)break}
    if(pick.length<6){for(const q of distractors(pick[0]||s.pool[0],12)){if(pick.length===6)break;if(!pick.includes(q)&&!pick.some(p=>CLUSTER[p.id].has(q.id)||shortAns(p)===shortAns(q)))pick.push(q)}}
    s.round=pick;s.left=new Set(pick.map(q=>q.id));s.miss={};s.queue=pick;s.idx=0;
    s.tiles=shuffle([...pick.map(q=>({k:"q",id:q.id,img:isPic(q)?q.img:null,txt:isPic(q)?"Kes kannab seda?":(q.q.length>110?q.q.slice(0,107)+"…":q.q)})),...pick.map(q=>({k:"a",id:q.id,txt:shortAns(q)}))])}
  el.innerHTML=`<div class="sess">${sbar()}<p class="src" style="margin:0 0 10px">Vali küsimus (K) ja sellele vastav vastus (V).</p><div class="mgrid">${s.tiles.map((x,i)=>`<button class="tile ${x.k} ${s.left.has(x.id)?"":"gone"}" data-i="${i}">${x.img&&IMG[x.img]?`<img src="${IMG[x.img]}" alt="">`:""}${esc(x.txt)}</button>`).join("")}</div></div>`;
  bindQuit();let sel=null;
  el.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{const x=s.tiles[+b.dataset.i];
    if(!sel){sel={x,b};b.classList.add("sel");return}
    if(sel.b===b){b.classList.remove("sel");sel=null;return}
    if(sel.x.k===x.k){sel.b.classList.remove("sel");sel={x,b};b.classList.add("sel");return}
    const a=sel,bb=b;sel=null;a.b.classList.remove("sel");
    if(a.x.id===x.id){rate(x.id,s.miss[x.id]?"part":"yes");s.left.delete(x.id);s.idx++;a.b.classList.add("gone");bb.classList.add("gone");
      $("#page-opi .sbar").outerHTML=sbar();bindQuit();if(!s.left.size)setTimeout(()=>{s.done=true;renderSummary()},350)}
    else{[a.b,bb].forEach(t=>{t.classList.add("bad","shake");setTimeout(()=>t.classList.remove("bad","shake"),400)});s.miss[a.x.id]=(s.miss[a.x.id]||0)+1;s.miss[x.id]=(s.miss[x.id]||0)+1;s.combo=0;
      [a.x.id,x.id].forEach(id=>{const st_=S.q[id]||(S.q[id]={r:0,p:0,w:0,last:null});st_.w++;st_.last="no";s.wrong.add(id)});save()}})}

/* summary */

  <h2>${tot?(s.res.yes/tot>=.8?"Väga hea töö!":s.res.yes/tot>=.5?"Hea algus!":"Kordamine teeb meistriks"):"Sessioon lõppes"}</h2>${rec}
  <div class="nums"><div style="background:var(--ok-bg);color:var(--ok)"><b>${s.res.yes}</b>teadsin</div><div style="background:var(--warn-bg);color:var(--warn)"><b>${s.res.part}</b>osaliselt</div><div style="background:var(--bad-bg);color:var(--bad)"><b>${s.res.no}</b>ei teadnud</div></div>
  <div class="mono">+${s.xp} XP · parim seeria 🔥${s.maxCombo}</div>
  <div class="acts">${wrong.length?`<button class="btn accent" id="again-wrong">Korda ainult valesid (${wrong.length})</button>`:""}<button class="btn" id="again">Uuesti</button><button class="btn primary" id="home">Teemade juurde</button></div></div></div>`;
  const m=s.mode,lbl=s.label,pool=s.pool;
  const w=$("#again-wrong");if(w)w.onclick=()=>start(m==="speed"||m==="match"?"flash":m,wrong,"Valed vastused");
  $("#again").onclick=()=>start(m,pool,lbl);$("#home").onclick=()=>{session=null;renderHome()}}

   <li>Tallinna Vangla valvuri ametijuhend (avalik)</li><li>KorS § 74 lg 1 (Sõnaveeb), vanglateenistus.ee uudis Tartu vangla direktori kohta, kantsleri käskkiri sisekontrolli talituse juhataja kohta</li></ol>
   </div>
  ${S.reports.length?`<h2 style="font-size:1.25rem;font-weight:800;margin:22px 0 12px">Minu veateated</h2>${S.reports.map(r=>{const q=BY[r.id];return `<div class="panel chitem"><div class="tp">${esc(TOP[q.t].short)} · ${q.num}</div><div class="q">${esc(q.q)}</div><div>${esc(r.t)}</div></div>`}).join("")}`:""}`;
  $("#copyCh").onclick=()=>copyText(changesText(),$("#copyFallback"));
  const cf=$("#copyFx");if(cf)cf.onclick=()=>copyText(fixesText(),$("#copyFallback"));
  el.querySelectorAll("[data-delfix]").forEach(b=>b.onclick=()=>{const id=b.dataset.delfix;S.fixes=S.fixes.filter(f=>f.id!==id);save();renderChanges();toast("Parandus kustutatud")});
  const cr=$("#copyRep");if(cr)cr.onclick=()=>copyText("MINU VEATEATED\n\n"+S.reports.map(r=>{const q=BY[r.id];return `[${TOP[q.t].title}] ${q.num}. ${q.q}\nMärkus: ${r.t}`}).join("\n\n"),$("#copyFallback"))}

/* ---------- settings ---------- */
$("#setBtn").onclick=()=>{const s=sheet(`<button class="iconbtn close" data-close aria-label="Sulge">✕</button><h2>Seaded</h2>
  <div class="grp"><div class="lab">Päeva eesmärk</div><div class="chips" id="goals">${[10,20,30,50,80].map(g=>`<button class="chip" aria-pressed="${S.goal===g}" data-g="${g}">${g} kaarti</button>`).join("")}</div></div>
  <div class="grp"><div class="lab">Teema</div><div class="chips" id="themes">${[["","Süsteemi järgi"],["light","Hele"],["dark","Tume"]].map(([v,l])=>`<button class="chip" aria-pressed="${(S.theme||"")===v}" data-th="${v}">${l}</button>`).join("")}</div></div>
  <div class="grp"><div class="lab">Parandusettepanekud</div><button class="btn" id="cpRep" ${S.fixes.length?"":"disabled"}>Kopeeri parandused tekstina (${S.fixes.length})</button><div id="cpFb"></div></div>
  <div class="grp"><div class="lab">Edenemine</div><p class="src" style="margin:0 0 8px">XP: ${S.xp} · vastatud ${Object.keys(S.q).length} küsimusele. Andmed on salvestatud ainult selles brauseris.</p><button class="btn ghost" id="reset" style="color:var(--bad);border-color:var(--bad)">Alusta otsast</button><div id="resetConfirm"></div></div>`);
  s.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.goal=+b.dataset.g;save();s.querySelectorAll("[data-g]").forEach(x=>x.setAttribute("aria-pressed",x===b));if(current==="opi"&&!session)renderHome()});
  s.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{S.theme=b.dataset.th||null;save();applyTheme();s.querySelectorAll("[data-th]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  $("#cpRep",s).onclick=()=>copyText(fixesText(),$("#cpFb",s));
  $("#reset",s).onclick=()=>{$("#resetConfirm",s).innerHTML=`<div class="warnbox" style="margin-top:10px">Kas kustutada kogu edenemine, XP, statistika ja sinu parandused? Seda ei saa tagasi võtta.<div style="display:flex;gap:8px;margin-top:10px"><button class="btn small" id="rNo">Ei</button><button class="btn small" id="rYes" style="background:var(--bad);color:#fff">Jah, alusta otsast</button></div></div>`;
    $("#rNo",s).onclick=()=>$("#resetConfirm",s).innerHTML="";$("#rYes",s).onclick=()=>{const th=S.theme,nm=S.name,us=S.user;S=blank();S.theme=th;S.name=nm;S.user=us;save();if(us){clearTimeout(syncT);pushSync(false)}s.remove();session=null;toast("Edenemine kustutatud");go(current)}}};

addEventListener("beforeprint",()=>{AS.print=true;if(!$("#page-all").dataset.built)renderAll();else drawAll()});
addEventListener("afterprint",()=>{AS.print=false;if(current==="koik")drawAll()});
document.getElementById("userBtn").onclick=()=>openLogin();updateUserBtn();
go(location.hash.slice(1)||"opi");
loadRemote();restoreUser();
})();
</script>

</body>
</html>

<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15202a">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Vangla kordamisküsimused</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: üks veerg telefonis; ülaosas kleepuv vahelehtede riba; „Kõik küsimused“ lehel laiemal ekraanil sisukord vasakul.
   Toon: vormi must ja hall + lipsunõela kollane metall aktsendina. */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --surface-2:#e8ecf0; --ink:#15202a; --muted:#56636f; --line:#d3dae1;
  --accent:#b8870f; --accent-soft:#f6e7bd; --accent-ink:#5e4300;
  --ok:#1d7f46; --ok-bg:#dcf2e4; --bad:#c0352d; --bad-bg:#fbe3e1; --warn:#9a6413; --warn-bg:#fcefd3;
  --fix:#5536cf; --fix-bg:#ebe6fd; --shadow:0 1px 2px rgba(20,32,42,.06),0 6px 20px rgba(20,32,42,.07);
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px; --dur:.28s;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e151c; --surface:#16202a; --surface-2:#1f2b36; --ink:#e6ecf1; --muted:#9caab6; --line:#2a3845;
  --accent:#e0b33e; --accent-soft:#4a3c14; --accent-ink:#f6dc94;
  --ok:#4fc483; --ok-bg:#16362a; --bad:#f2766c; --bad-bg:#3c1f1d; --warn:#f0b54d; --warn-bg:#3a2e15;
  --fix:#a993ff; --fix-bg:#2a2348; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151c; --surface:#16202a; --surface-2:#1f2b36; --ink:#e6ecf1; --muted:#9caab6; --line:#2a3845;
  --accent:#e0b33e; --accent-soft:#4a3c14; --accent-ink:#f6dc94;
  --ok:#4fc483; --ok-bg:#16362a; --bad:#f2766c; --bad-bg:#3c1f1d; --warn:#f0b54d; --warn-bg:#3a2e15;
  --fix:#a993ff; --fix-bg:#2a2348; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}

/* top nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;padding-block:8px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1rem;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap;border:0;background:transparent;padding:8px 6px;border-radius:12px;color:var(--ink)}
.brand:hover{background:var(--surface-2)}
.brand .pin{width:22px;height:10px;border-radius:3px;background:var(--accent);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.tabs{display:flex;gap:4px;flex:1;justify-content:center;min-width:0}
.tab{border:0;background:transparent;padding:10px 12px;border-radius:12px;font-weight:700;font-size:.95rem;color:var(--muted);white-space:nowrap}
.tab[aria-current="page"]{background:var(--ink);color:var(--surface)}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
@media (max-width:620px){.top .wrap{flex-wrap:wrap;row-gap:4px}.brand{order:1;flex:1}#userBtn{order:2}#setBtn{order:2}.tabs{order:3;flex-basis:100%;justify-content:space-between}.tab{flex:1;padding:9px 6px;font-size:.9rem}.top .iconbtn.hide-sm{display:none}}
@media (max-width:360px){.tab{padding:8px 6px;font-size:.8rem}}

main{padding-block:20px 80px}
.page[hidden]{display:none}

/* generic */
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--surface-2);color:var(--ink);min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--surface)}
.btn.accent{background:var(--accent);color:#1d1400}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn svg{width:20px;height:20px;flex:none}
.btn.small{min-height:38px;padding:7px 12px;font-size:.9rem;border-radius:11px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.92rem;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
mark.kw{background:var(--accent-soft);color:inherit;border-radius:5px;padding:0 3px;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark.hit{background:var(--ok-bg);color:var(--ok);border-radius:5px;padding:0 3px;font-weight:700}
mark.miss{background:var(--bad-bg);color:var(--bad);border-radius:5px;padding:0 3px;font-weight:700}
mark.sr{background:#ffe05a;color:#1b1500;border-radius:4px;padding:0 2px}
.ans{white-space:pre-line;overflow-wrap:anywhere}
.ans .var{display:block;padding-left:12px;border-left:3px solid var(--line);margin-top:8px}
.ans .var:first-child{margin-top:0}
.ans .varlbl{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-weight:700;font-size:.8rem;border:0;line-height:1.4;white-space:nowrap}
.b-fix{background:var(--fix-bg);color:var(--fix)}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-unv{background:var(--warn-bg);color:var(--warn)}
button.badge{cursor:pointer}
.diff{display:grid;gap:8px;margin-top:10px;border:1px dashed var(--fix);border-radius:12px;padding:12px;background:color-mix(in srgb,var(--fix-bg) 45%,transparent)}
.diff .old{background:var(--bad-bg);color:var(--bad);text-decoration:line-through;border-radius:8px;padding:8px 10px;white-space:pre-line}
.diff .new{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:8px 10px;white-space:pre-line;font-weight:700}
.diff .lbl{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.src{font-size:.85rem;color:var(--muted)}

/* ---------- LEARN HOME ---------- */
.hero{display:grid;gap:14px;grid-template-columns:1.2fr 1fr;align-items:stretch;margin-bottom:22px}
@media (max-width:780px){.hero{grid-template-columns:1fr}}
.hello{padding:20px}
.hello h1{font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:800;letter-spacing:-.01em}
.hello p{margin:.4rem 0 0;color:var(--muted)}
.lvl{display:flex;align-items:center;gap:12px;margin-top:16px}
.lvl .name{font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.xpbar{flex:1;height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-self:start}
.kpi{padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-display);font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.kpi span{font-size:.82rem;color:var(--muted);font-weight:700;letter-spacing:.02em}
.goalbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.goalbar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.quick{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 0 12px}
.sechead h2{font-size:1.35rem;font-weight:800}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tcard{position:relative;border:0;text-align:left;border-radius:20px;padding:18px;color:#fff;background:var(--tc);display:grid;grid-template-columns:1fr auto;gap:6px 12px;min-height:150px;box-shadow:var(--shadow);transition:transform .18s;overflow:hidden}
.tcard:hover{transform:translateY(-2px)}
.tcard:active{transform:scale(.98)}
.tcard::after{content:"";position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.tcard .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.tcard .ic svg{width:24px;height:24px;stroke:#fff}
.tcard h3{grid-column:1/-1;font-size:1.15rem;font-weight:800;align-self:end}
.tcard .meta{grid-column:1/-1;font-size:.85rem;opacity:.9;display:flex;gap:10px;flex-wrap:wrap}
.ring{width:60px;height:60px;grid-row:1;grid-column:2;position:relative}
.ring svg{width:60px;height:60px;transform:rotate(-90deg)}
.ring .tr{stroke:rgba(255,255,255,.25)}
.ring .fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .4s ease-out}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:.82rem}

@media (max-width:560px){.tgrid{grid-template-columns:1fr 1fr;gap:10px}.tcard{padding:14px;min-height:150px;gap:4px 8px}.tcard h3{font-size:1rem}.tcard .meta{font-size:.78rem;gap:6px}.ring,.ring svg{width:48px;height:48px}.tcard .ic{width:38px;height:38px}}
/* stats */
.stats{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
@media (max-width:860px){.stats{grid-template-columns:1fr}}
.stats .panel{padding:16px}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(0,170px) 1fr 44px;gap:10px;align-items:center;font-size:.9rem;border:0;background:transparent;text-align:left;padding:0}
.barrow .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.barrow .trk{height:14px;background:var(--surface-2);border-radius:99px;overflow:hidden;display:flex}
.barrow .trk i{height:100%;display:block;transition:width .4s}
.barrow .pct{font-family:var(--f-mono);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
.subbars{display:grid;gap:8px;padding:6px 0 6px 14px;border-left:2px solid var(--line);margin-left:6px}
.subbars .barrow{grid-template-columns:minmax(0,156px) 1fr 44px;font-size:.84rem}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hardlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hardlist li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:.92rem}
.hardlist .cnt{font-family:var(--f-mono);background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:2px 8px;font-size:.8rem}
.empty{color:var(--muted);font-size:.92rem;padding:8px 0}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(8,14,20,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));animation:up .25s ease-out}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-size:1.4rem;font-weight:800}
.sheet .grp{margin-top:18px}
.sheet .grp>.lab{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:left;display:grid;gap:4px;min-height:96px}
.mode b{font-family:var(--f-display);font-size:1.05rem}
.mode span{font-size:.84rem;color:var(--muted)}
.mode .mi{width:30px;height:30px;color:var(--accent)}
.mode:hover{border-color:var(--ink)}
.sheet .close{float:right}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}

/* ---------- SESSION ---------- */
.sess{max-width:680px;margin:0 auto}
.sbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.prog{flex:1;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .25s}
.combo{font-family:var(--f-mono);font-size:.9rem;min-width:52px;text-align:right}
.combo.hot{color:var(--bad)}
.xpchip{font-family:var(--f-mono);font-size:.85rem;background:var(--accent-soft);color:var(--accent-ink);border-radius:99px;padding:4px 10px}
.stage{position:relative;height:min(66vh,540px);height:clamp(340px,calc(100dvh - 300px),600px);perspective:1400px;margin-bottom:14px;touch-action:none;user-select:none;-webkit-user-select:none}
.fc{position:absolute;inset:0;transition:transform .35s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;cursor:pointer}
.fc.drag{transition:none}
.fc.fly{transition:transform .26s ease-in,opacity .26s}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.fc .back{transform:rotateY(180deg)}
.fc.flipped .inner{transform:rotateY(180deg)}
.fc .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .35s cubic-bezier(.3,.7,.2,1)}
.face .tl{display:flex;justify-content:space-between;gap:10px;font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.face .tl .dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--tc);margin-right:6px;vertical-align:0}
.face .qtext{font-family:var(--f-display);font-weight:800;font-size:clamp(1.3rem,4.6vw,1.75rem);line-height:1.22;margin:auto 0;text-wrap:balance}
.face .tap{font-size:.85rem;color:var(--muted);text-align:center}
.face .qsmall{font-weight:700;font-size:.95rem;color:var(--muted);line-height:1.35}
.face .abody{flex:1;overflow:auto;font-size:1.1rem;padding-right:4px;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;min-height:0}
.face .abody.more{-webkit-mask-image:linear-gradient(#000 85%,transparent);mask-image:linear-gradient(#000 85%,transparent)}
.face .abody.more.end{-webkit-mask-image:none;mask-image:none}
.scrollhint{font-size:.78rem;color:var(--muted);text-align:center;margin-top:-6px}
@media (max-width:420px){main{padding-block:12px 60px}.face .afoot .src{font-size:.74rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1 1 140px}.face .afoot .btn.small{min-height:34px;padding:5px 10px;font-size:.82rem}.fc .face{padding:16px;gap:10px;border-radius:20px}.face .qsmall{font-size:.88rem}.face .abody{font-size:1rem}.face .abody.s{font-size:.95rem}.face .abody.xs{font-size:.88rem}.rate{min-height:54px}.hint{display:none}}
.face .abody.s{font-size:1rem}.face .abody.xs{font-size:.92rem}
.face .afoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tint{position:absolute;inset:0;border-radius:24px;pointer-events:none;opacity:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:#fff;z-index:3}
.rates{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.rate{border:0;border-radius:16px;min-height:58px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.95rem}
.rate small{font-family:var(--f-mono);font-size:.7rem;opacity:.75}
.r-no{background:var(--bad-bg);color:var(--bad)}
.r-part{background:var(--warn-bg);color:var(--warn)}
.r-yes{background:var(--ok-bg);color:var(--ok)}
.hint{text-align:center;font-size:.82rem;color:var(--muted);margin-top:10px}
.flash{position:fixed;inset:0;pointer-events:none;z-index:35;opacity:0}
.flash.g{animation:flg .38s}
@keyframes flg{0%{opacity:.35;background:var(--ok)}100%{opacity:0;background:var(--ok)}}
.xpfloat{position:fixed;z-index:36;font-family:var(--f-display);font-weight:800;color:var(--ok);font-size:1.3rem;pointer-events:none;animation:xpf .7s ease-out forwards}
@keyframes xpf{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-50px);opacity:0}}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* write */
.wcard{padding:20px;display:grid;gap:14px}
.wcard .qtext{font-family:var(--f-display);font-weight:800;font-size:clamp(1.2rem,4.2vw,1.55rem);line-height:1.25}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg);resize:vertical;font-size:1.05rem}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp>div{border-radius:14px;padding:12px;background:var(--surface-2);min-width:0}
.cmp h4{margin:0 0 6px;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.score{font-family:var(--f-display);font-weight:800;font-size:1.25rem}
.kwchips{display:flex;flex-wrap:wrap;gap:6px}

/* speed */
.timer{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-bottom:14px}
.timer i{display:block;height:100%;background:var(--accent)}
.timer.low i{background:var(--bad)}
.opts{display:grid;gap:10px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;min-height:56px;font-size:1rem;line-height:1.35;transition:background .15s}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.bigq{padding:18px;margin-bottom:12px}
.bigq .qtext{font-family:var(--f-display);font-weight:800;font-size:clamp(1.15rem,4vw,1.45rem);line-height:1.25}

/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;min-height:92px;text-align:left;font-size:.92rem;line-height:1.3;transition:transform .2s,opacity .25s,background .15s;overflow-wrap:anywhere}
.tile.q{font-weight:700}
.tile.q::before{content:"K";display:block;font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-bottom:4px}
.tile.a::before{content:"V";display:block;font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-bottom:4px}
.tile.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.tile.bad{background:var(--bad-bg);border-color:var(--bad)}
.tile.gone{transform:scale(.85);opacity:0;pointer-events:none}

/* summary */
.sum{padding:22px;text-align:center;display:grid;gap:16px;justify-items:center}
.sum h2{font-size:1.6rem;font-weight:800}
.sum .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.sum .nums div{border-radius:14px;padding:12px}
.sum .nums b{display:block;font-family:var(--f-display);font-size:1.8rem;font-variant-numeric:tabular-nums}
.sum .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* ---------- ALL ---------- */
.allgrid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.allgrid{grid-template-columns:minmax(0,1fr)}}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto;padding:14px;font-size:.9rem}
.toc a{color:inherit;text-decoration:none;display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:8px}
.toc a:hover{background:var(--surface-2)}
.toc .t{font-weight:700;margin-top:6px}
.toc .s{padding-left:18px;color:var(--muted)}
.toc .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
@media (max-width:900px){.toc{position:static;max-height:none;display:none}.toc.open{display:block}}
.tools{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:16px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;min-height:48px}
.tocbtn{display:none}
@media (max-width:900px){.tocbtn{display:inline-flex}}
.summaryline{font-size:.9rem;color:var(--muted)}
.tsec{margin-bottom:14px;overflow:hidden}
.thead{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:16px;text-align:left}
.thead .sw{width:14px;height:14px;border-radius:4px;background:var(--tc);flex:none}
.thead h2{font-size:1.15rem;font-weight:800;flex:1}
.thead .cnt{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);white-space:nowrap}
.chev{width:18px;height:18px;transition:transform .2s;flex:none}
.open>.thead .chev,.open>.shead .chev{transform:rotate(90deg)}
.tbody,.sbody{display:none}
.open>.tbody,.open>.sbody{display:block}
.tbody{padding:0 12px 12px}
.ssec{border-top:1px solid var(--line)}
.shead{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:12px 6px;text-align:left;flex-wrap:wrap}
.shead h3{font-size:1rem;font-weight:800;flex:1;min-width:160px}
.shead .counts{display:flex;gap:6px;flex-wrap:wrap}
.sbody{display:none;padding:0 4px 10px}
.qa{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;background:var(--surface);scroll-margin-top:90px}
.qa.flashme{animation:flashme 1.2s}
@keyframes flashme{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:none}}
.qa h4{margin:0 0 8px;font-size:1.02rem;line-height:1.35;display:flex;gap:10px}
.qa h4 .n{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);background:var(--surface-2);border-radius:7px;padding:2px 7px;height:fit-content;flex:none}
.qa .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.qa .note{font-size:.85rem;color:var(--muted);margin-top:6px}
.qa .see{font-size:.85rem;margin-top:6px;color:var(--muted)}
.qa .see a{color:var(--fix);font-weight:700;text-decoration:none;margin-right:8px;display:inline-block}
.qa .see a:hover{text-decoration:underline}
.qa .mine{font-size:.78rem;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--bad-bg);color:var(--bad)}

/* ---------- CHANGES ---------- */
.chtop{padding:18px;display:grid;gap:12px;margin-bottom:16px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tri div{border-radius:14px;padding:12px}
.tri b{display:block;font-family:var(--f-display);font-size:1.9rem;font-variant-numeric:tabular-nums}
.chitem{padding:16px;margin-bottom:12px}
.chitem .q{font-weight:700;margin:4px 0 6px}
.chitem .tp{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.srclist{margin:0;padding-left:18px;font-size:.92rem}
.srclist li{margin:4px 0}
.warnbox{background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.92rem}
.warnbox b{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;z-index:60;font-weight:700;animation:up .2s}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.lvlup{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:71;background:var(--surface);border:2px solid var(--accent);border-radius:20px;padding:18px 26px;text-align:center;box-shadow:var(--shadow);animation:up .3s}
.lvlup b{display:block;font-family:var(--f-display);font-size:1.6rem}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* pictures, community fixes */
.qimg{display:block;max-width:100%;max-height:220px;width:auto;border-radius:12px;border:1px solid var(--line);background:#111;margin:4px 0}
.face .qimg{max-height:34%;margin:0 auto;flex:none;object-fit:contain}
.face.back .qimg{max-height:120px}
.qa .qimg{max-height:240px;margin:6px 0 4px}
.bigq .qimg{max-height:180px;margin:8px 0 0}
.tile img{display:block;width:100%;max-height:70px;object-fit:contain;border-radius:8px;background:#111}
.people{margin-top:10px;border-radius:12px;background:var(--surface-2);padding:10px 12px;font-size:.95rem}
.people .who{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.people ul{margin:4px 0 0;padding-left:18px}.people li{margin:3px 0}
.b-add{background:var(--accent-soft);color:var(--accent-ink)}
.cfix{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cfix .row{padding:9px 12px;display:grid;gap:2px;border-top:1px solid var(--line)}
.cfix .row:first-child{border-top:0;background:var(--surface-2)}
.cfix .who{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.cfix .row.own .who{color:var(--fix)}
.cfix .txt{white-space:pre-line;overflow-wrap:anywhere}
.cfix .nt{font-size:.85rem;color:var(--muted)}
.fld{display:grid;gap:4px;margin-top:10px}
.fld input{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);min-height:46px}
.lbl2{font-size:.85rem;font-weight:700;color:var(--muted)}
/* account, votes, leaderboard */
.userchip{border:1px solid var(--line);background:var(--surface);border-radius:12px;height:42px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;max-width:180px;flex:none}
.userchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userchip svg{width:18px;height:18px;flex:none}
.userchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.vote{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem;min-height:34px;justify-self:start;margin-top:4px}
.vote[aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lb li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
.lb li.me{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.lb .rk{font-family:var(--f-mono);font-size:.85rem;text-align:center}
.lb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .xp{font-family:var(--f-mono);font-size:.85rem}
.loginnote{background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:12px 14px;font-weight:700;margin-top:10px}
/* print */
@media print{
  body::before,.top,.tools,.toc,.tocbtn,.meta button,.page:not(#page-all){display:none!important}
  #page-all{display:block!important}
  body{background:#fff;color:#000;font-size:11pt}
  .allgrid{display:block}
  .tbody,.sbody{display:block!important}
  .chev{display:none}
  .panel,.qa{box-shadow:none;border-color:#bbb;break-inside:avoid}
  .tsec{break-before:page}
  .tsec:first-child{break-before:auto}
  mark.kw{background:#f3e3b0}
  .diff .old{background:#fde2e0}.diff .new{background:#dff3e5}
}
</style>

õib mitut moodi sõnastada): ühtsete käitumisstandardite kujundamine ja nõustamine eetiliste dilemmade puhul.\n(ühtsete käitumistandardite kujundamine ja nõustamine eetiliste dilemmade puhul)\nEetikakoodeks tugineb meie kultuuriruumi headele tavadele, traditsioonidele, üldtunnustatud moraalinormidele ning vanglateenistuse ülesannetele.","variants":["Eetikakoodeks annab ametnikule juhised, kuidas oma töös õigesti ja eetiliselt käituda ning otsuseid langetada.","Organisatsioonikultuuri parandamine nii organisatsiooni siseselt kui ka suhtluses teiste organisatsioonidega, samuti käitumisstandardite kujundamine ja nõustamine eetiliste dilemmade puhul.","Vastus(võib mitut moodi sõnastada): ühtsete käitumisstandardite kujundamine ja nõustamine eetiliste dilemmade puhul.","(ühtsete käitumistandardite kujundamine ja nõustamine eetiliste dilemmade puhul)","Eetikakoodeks tugineb meie kultuuriruumi headele tavadele, traditsioonidele, üldtunnustatud moraalinormidele ning vanglateenistuse ülesannetele."],"status":"ok","src":"Slaidid „Kutse-eetika“; eetikakoodeksi sissejuhatus","note":"","see":["VG61"],"kw":["käitumisstandardite","eetiliste dilemmade"]},{"id":"EK4","num":4,"q":"Kas kõrvaltegevustest tuleb teavitada tööandjat?","a":"Jah","variants":["Jah"],"status":"ok","src":"ATS § 60 lg 3","note":"Teavitada tuleb viivitamata ja kirjalikult ametisse nimetamise õigusega isikut.","see":[],"kw":["Jah"]},{"id":"EK5","num":5,"q":"Mis on eetikakoodeksi 2 põhilist elementi?","a":"ühised standardid (mh koostöö toetamiseks), isikutevaheliste tüli vähendamine.","variants":["ühised standardid (mh koostöö toetamiseks), isikutevaheliste tüli vähendamine."],"status":"ok","src":"Slaidid „Kutse-eetika“","note":"","see":["EK9"],"kw":["ühised standardid","tüli vähendamine"]},{"id":"EK8","num":8,"q":"Mis on eetikakoodeks?","a":"Eetikakoodeks on põhimõtete ja käitumisreeglite kogum, mis suunab inimese eetilist ja vastutustundlikku käitumist.","variants":["Eetikakoodeks on põhimõtete ja käitumisreeglit . konvoi puhul\nKui jah, siis too näide. Vastus: Jah, valvepiirkond võib olla liikuv. Näiteks siis kui kinnipeetavat tuleb transportida ühest kohast teise. Siis on valvepiirkonnaks sõiduk, milles kinnipeetud isik asub.\nJah,näiteks saateülessandeid täitev saateauto","variants":["Jah, nt. konvoi puhul","Kui jah, siis too näide. Vastus: Jah, valvepiirkond võib olla liikuv. Näiteks siis kui kinnipeetavat tuleb transportida ühest kohast teise. Siis on valvepiirkonnaks sõiduk, milles kinnipeetud isik asub.","Jah,näiteks saateülessandeid täitev saateauto"],"status":"unv","src":"","note":"Määrus (§ 7) defineerib valvepiirkonna kui territooriumi, hoone, rajatise või nende osa ja lubab ajutist valvepiirkonda (§ 10 lg 5 p 6). Liikuvat valvepiirkonda määrus otse ei nimeta.","see":[],"kw":["Jah","konvoi","saateauto"]},{"id":"DI32","num":32,"q":"Mis on valvepiirkond ja valveplaan?","a":"Valvepiirkond on ametnikule määratud ala, kus ta täidab oma valve ülesandeid. Valveplaan määrab valve korralduse, ülesannete jaotuse ning vastutusalad.","variants":["Valvepiirkond on ametnikule määratud ala, kus ta täidab oma valve ülesandeid. Valveplaan määrab valve korralduse, ülesannete jaotuse ning vastutusalad."],"status":"ok","src":"Järelevalve korraldus vanglas (kehtiv 05.10.2026) § 7, § 10","note":"","see":["DI2","DI18","DI34"],"kw":["Valvepiirkond","Valveplaan"]},{"id":"DI34","num":34,"q":"Mis on valvepiirkond ja milleks kasutatakse valveplaani?","a":"Valvepiirkond on järelevalveks määratud ala, hoone või selle osa. Valveplaaniga määratakse toimkonna liikmete ülesanded ja jaotus valvepiirkondade vahel.","variants":["Valvepiirkond on järelevalveks määratud ala, hoone või selle osa. Valveplaaniga määratakse toimkonna liikmete ülesanded ja jaotus valvepiirkondade vahel."],"status":"ok","src":"Järelevalve korraldus vanglas (kehtiv 05.10.2026) § 7 lg 1, § 10","note":"","see":["DI2","DI32"],"kw":["Valvepiirkond","Valveplaan"]},{"id":"DI37","num":37,"q":"Millisteks osadeks jaguneb valvepiirkond a Vangla valvuri ametijuhend p 30; Vahetu sunni kasutamise oskuste standard (2016); Järelevalve korraldus vanglas (kehtiv 05.10.2026) § 12 lg 2","note":"Enne avamist peab olema ülevaade kambris toimuvast (vaateava).","see":["UK1","UK13","UK16","UK19","UK21","UK33"],"kw":["vaata","kambris","kuulta"]},{"id":"UK33","num":33,"q":"Mida vöiks teha ennem kambriukse avamist ja miks?","a":"- Kuulata ja vaadata kambrisse, et tagada enda ja teiste ohutus","variants":["- Kuulata ja vaadata kambrisse, et tagada enda ja teiste ohutus"],"status":"ok","src":"Tallinna Vangla valvuri ametijuhend p 30; Vahetu sunni kasutamise oskuste standard (2016); Järelevalve korraldus vanglas (kehtiv 05.10.2026) § 12 lg 2","note":"Enne avamist peab olema ülevaade kambris toimuvast (vaateava).","see":["UK1","UK13","UK16","UK19","UK21","UK31"],"kw":["Kuula","vaadata"]},{"id":"UK34","num":34,"q":"Mida võiks tavaolukorras teha enne kambrisse sisenemist?","a":"Teavitada kinnipeetavat, miks sisenesid või mis järgneb. Nt. Äratus, saatmine vms","variants":["Teavitada kinnipeetavat, miks sisenesid või mis järgneb. Nt. Äratus, saatmine vms"],"status":"unv","src":"","note":"Praktiline võte, mida kirjalikes allikates ei ole (tõenäoliselt loengust või väljaõppest).","see":[],"kw":["kinnipeetavat","Teavitada","sisenesid"]}]},{"name":"Loendus","questions":[{"id":"UK3","num":3,"q":"Mitu korda päevas viiakse üldjuhul kambrites läbi loendus?","a":"üldjuhul viiakse kambrites läbi loendust kaks korda päevas, hommikul ja õhtul.","variants":["üldjuhul viiakse kambrites läbi loendust kaks korda päevas, hommikul ja õhtul."],"status":"ok","src":"Tallinna Vangla kodukord (01.09.2026), päevakava","note":"Päevakavas on loendus hommikul (koos toitlustamisega) ja õhtul kell 19–20.","see":["VG60","UK19"],"kw":["kaks korda","hommikul ja õhtul"]},{"id":"UK4","num":4,"q":"Mida peab ametnik kontrollima kinnipeetavate loenduse ajal?","a":"Kinnipeetavate arvu ja isikut, nende tervislikku seisundit ning visuaalselt kambri tehnilist seisukorda.","variants":["Kinnipeetavate arvu ja isikut, nende tervislikku seisundit ning visuaalselt kambri tehnilist seisukorda."],"status":"fix","src":"Tallinna Vangla kodukord (01.09.2026) p 6.4","note":"","see":["UK11","UK17"],"orig":"Ametnik peab loenduse ajal kontrollima kinnipeetavate arvu, kambri seisukorda","why":"Algvastusest puudusid kinnipeetava isiku ja terviseseisundi kontroll.","kw":["Kinnipeetavate","tervislikku","visuaalselt"]},{"id":"UK5","num":5,"q":"Mitu valvurit teostab loendust?","a":"Kaks","variants":["Kaks"],"status":"unv","src":"","note":"Valvurite arvu loendusel allikad ei nimeta.","see":[],"kw":["Kaks"]},{"id":"UK6","num":6,"q":"Mis on loenduse eesmärk vanglas?","a":"Kinnipeetavate arvu, asukoha, terviseseisundi ning nende kambrite korrashoiu kindlaks tegemine.","variants":["Kinnipeetavate arvu, asukoha, terviseseisundi ning nende kambrite korrashoiu kindlaks tegemine."],"status":"ok","src":"Tallinna Vangla kodukord (01.09.2026) p 6.1, 6.4","note":"","see":["UK14"],"kw":["terviseseisundi","Kinnipeetavate","korrashoiu"]},{"id":"UK9","num":9,"q":"Kellele kannab valvur ette kinnipeetavate loenduse tulemuse?","a":"Vanemvalvurile.","variants":["Vanemvalvurile."],"status":"ok","src":"Tallinna Vangla valvuri ametijuhend p 7","note":"","see":[],"kw":["Vanemvalvurile"]},{"id":"UK11","num":11,"q":"Nimeta vähemalt 3 tähtsat loenduse punkti/mõtet?","a":"Kambrite tehniline kontroll, õige kinnipeetav õiges kambris, kinnipeetava vigastuste märkamine kui on, avalduste vastuvõtmine, kinnipeetavatega vestlemine.","variants":["Kambrite tehniline kontroll, õige kinnipeetav õiges kambris, kinnipeetava vigastuste märkamine kui on, avalduste vastuvõtmine, kinnipeetavatega vestlemine."],"status":"unv","src":"","note":"Kodukord kinnitab isiku, terviseseisundi ja kambri tehnilise seisukorra kontrolli (p 6.4). Avalduste vastuvõtmist ja vestlemist allikad ei nimeta.","see":["UK4","UK17"],"kw":["kinnipeetavatega","vastuvõtmine","vigastuste"]},{"id":"UK14","num":14,"q":"Miks viiakse läbi kinnipeetavate loendusi?","a":"Loenduse eesmärk on kontrollida kinnipeetavate kohalolekut ja tagada vangla julgeolek.","variants":["Loenduse eesmärk on kontrollida kinnipeetavate kohalolekut ja tagada vangla julgeolek."],"status":"ok","src":"Tallinna Vangla kodukord (01.09.2026) p 6.1","note":"","see":["UK6"],"kw":["kinnipeetavate","kontrollida","kohalolekut"]},{"id":"UK17","num":17,"q":"Mida loenduse käigus kontrollitakse?","a":"Visuaalselt kinnipeetava tervislikku seisundit ja kambri seisukorda","variants":["Visuaalselt kinnipeetava tervislikku seisundit ja kambri seisukorda"],"status":"ok","src":"Tallinna Vangla kodukord (01.09.2026) p 6.4","note":"","see":["UK4","UK11"],"kw":["kinnipeetava","Visuaalselt","tervislikku"]},{"id":"UK22","num":22,"q":"Nimeta vähemalt 3 asja, mida kinnipeetav on kohustatud tegema loenduse ajal.","a":"kõik kohustused- loenduse ajaks on kohustatud kinnipeetav püsti tõusma, korrastama oma voodi, välja lülitama töötavad elektriseadmed, kandma loenduse ajal vangla riietust ning olema riietatud korrektselt, kandma loenduse ajal nimesilti (kaelas), on keelatud takistada või segada loenduse läbi viimist, on kohustatud hoidma käsi nähtaval.","variants":["kõik kohustused- loenduse ajaks on kohustatud kinnipeetav püsti tõusma, korrastama oma voodi, välja lülitama töötavad elektriseadmed, kandma loenduse ajal vangla riietust ning olema riietatud korrektselt, kandma loenduse ajal nimesilti (kaelas), on keelatud takistada või segada loenduse läbi viimist, on kohustatud hoidma käsi nähtaval."],"status":"ok","src":"Kinnitanud Chris","note":"Kehtiv Tallinna kodukord nimetab: olla riides, seista püsti, tulla ukse juurde, nimesilt nähtaval (p 4.10, 6.3). Voodi peab olema korras, sest kamber peab olema korras, ja elektriseadmed lülitatakse välja müra ja ohu vältimiseks (kinnitanud Chris).","see":["UK30"],"kw":["püsti tõusma","nimesilti","käsi nähtaval"]},{"id":"UK30","num":30,"q":"Nimeta kolm asja, mida peavad kinnipeetavad järgima loenduse ajal?","a":"(nimesilt kaelas - nimi nähtaval, riietus korrektne, elektriseadmed välja lülitatud jne)","variants":["(nimesilt kaelas - nimi nähtaval, riietus korrektne, elektriseadmed välja lülitatud jne)"],"status":"ok","src":"Kinnitanud Chris","note":"Kodukord p 4.10, 6.3; elektriseadmete väljalülitamise kinnitas Chris.","see":["UK22"],"kw":["nimesilt","riietus korrektne","elektriseadmed"]}]},{"name":"Ravimite jagamine","questions":[{"id":"UK10","num":10,"q":"Mille alusel jagab valvur kinnipeetavatele ravimeid?","a":"Arsti ettekirjutuse alusel. Valvur veendub, et kinnipeetav võttis ravimi sisse.","variants":["Arsti ettekirjutuse alusel. Valvur veendub, et kinnipeetav võttis ravimi sisse."],"status":"ok","src":"Tallinna Vangla kodukord (01.09.2026) p 19.7; Tallinna Vangla valvuri ametijuhend p 27; Järelevalve korraldus vanglas (kehtiv 05.10.2026) § 38 lg 1","note":"","see":["UK20"],"kw":["Arsti ettekirjutuse","kinnipeetav","veendub"]},{"id":"UK15","num":15,"q":"Miks peab ravimite jagamisel olema eriti tähelepanelik?","a":"Selleks, et ravim jõuaks õige kinnipeetavani ning välistada ravimite väärkasutamine.","variants":["Selleks, et ravim jõuaks õige kinnipeetavani ning välistada ravimite väärkasutamine."],"status":"unv","src":"","note":"Arutlusküsimus: vastus ei tulene otseselt normist.","see":[],"kw":["kinnipeetavani","väärkasutamine","välistada"]},{"id":"UK18","num":18,"q":"Kas valvur võib kinnipeetavale jagada psühhotroopseid ravimeid?","a":"Ei, psühhotroopseid ravimeid jagatakse ainult koos med. Töötajaga","variants":["Ei, psühhotroopseid ravimeid jagatakse ainult koos med. Töötajaga"],"status":"ok","src":"Järelevalve korraldus vanglas (kehtiv 05.10.2026) § 38 lg 2; Tallinna Vangla kodukord p 19.8","note":"Määruse järgi peab psühhotroopsete ja narkootiliste ravimite jagamise juures viibima tervishoiutöötaja. Tallinna kodukorra järgi annab need ravimid tervishoiutöötaja ise.","see":[],"kw":["Ei","med. Töötajaga"]},{"id":"UK20","num":20,"q":"Mida tuleb teha peale ravimite väljastamist kinnipeetavale?","a":"Kontrollida ravimite manustamist.","variants":["Kontrollida ravimite manustamist."],"status":"ok","src":"Tallinna Vangla kodukord (01.09.2026) p 19.7; Järelevalve korraldus vanglas (kehtiv 05.10.2026) § 38 lg 3","note":"","see":["UK10"],"kw":["Kontrollida","manustamist","ravimite"]},{"id":"UK26","num":26,"q":"Kuidas võib üksainus eksimus ravimite jagamisel mõjutada vangla tööd?","a":"Vale ravimi või vale koguse manustamine võib põhjustada tervisekahjustusi ning kaasa tuua teenistusliku vastutuse.","variants":["Vale ravimi või vale koguse manustamine võib põhjustada tervisekahjustusi ning kaasa tuua teenistusliku vastutuse."],"status":"unv","src":"","note":"Arutlusküsimus: vastus ei tulene otseselt normist.","see":[],"kw":["tervisekahjustusi","teenistusliku","manustamine"]},{"id":"UK27","num":27,"q":"Milliseid nõudeid tuleb järgida ravimite jagamisel?","a":"Ravimeid tuleb jagada tervishoiutöötaja korralduste ja kehtiva korra järgi, kontrollides ravimi saaja ja ravimi vastavust ning teatades kõrvalekalletest.","variants":["Ravimeid tuleb jagada tervishoiutöötaja korralduste ja kehtiva korra järgi, kontrollides ravimi saaja ja ravimi vastavust ning teatades kõrvalekalletest."],"status":"ok","src":"Tallinna Vangla kodukord (01.09.2026) p 19.7–19.8; Järelevalve korraldus vanglas (kehtiv 05.10.2026) § 38","note":"","see":[],"kw":["tervishoiutöötaja","kõrvalekalletest","kontrollides"]},{"id":"UK28","num":28,"q":"Kas ravimite jagamine toimub tavaliselt loenduse ajal?","a":"Ei. Ravimite jagamine on eraldi toiming ning loenduse ajal tehakse seda erandkorras. Üldjuhul ravimeid läbi toiduluugi ei jagata, kuid eraldi loaga võib, näiteks kui kinnipeetav on agressiivne.","variants":["Ei. Ravimite jagamine on eraldi toiming ning loenduse ajal tehakse seda erandkorras. Üldjuhul ravimeid läbi toiduluugi ei jagata, kuid eraldi loaga võib, näiteks kui kinnipeetav on agressiivne."],"status":"fix","src":"Kinnitanud Chris; Tallinna Vangla kodukord p 19.7","note":"","see":["UK29","UK32"],"kw":["Ei","toiduluugi","eraldi loaga"],"orig":"Ei. Ravimite jagamine on eraldi toiming ning loenduse ajal tehakse seda erandkorras. Ravimeid ei jagata läbi toiduluugi.","why":"Lisatud erand: eraldi loaga võib ravimeid jagada ka läbi toiduluugi."},{"id":"UK29","num":29,"q":"Miks ei tohi ravimeid jagada läbi kambriluugi?","a":"(kontrolli puudumine - kas neelas alla, nakrootiliste ja psühhotroopsete oht - valuuta, oht, et teine kinnipeetav  saab ravimi)","variants":["(kontrolli puudumine - kas neelas alla, nakrootiliste ja psühhotroopsete oht - valuuta, oht, et teine kinnipeetav  saab ravimi)"],"status":"ok","src":"Tallinna Vangla kodukord (01.09.2026) p 19.7","note":"Kodukorra järgi tuleb kinnipeetav ravimi võtmiseks kambri avatud ukse juurde ja manustab ravimi ametniku juuresolekul. Erand: eraldi loaga võib ravimeid jagada ka läbi toiduluugi, näiteks agressiivse kinnipeetava puhul (kinnitanud Chris).","see":["UK28","UK32"],"kw":["kas neelas alla","valuuta"]},{"id":"UK32","num":32,"q":"Kas ravimeid jagatakse läbi toiduluugi?","a":"- Ei, selleks toiminguks avatakse uks ja kinnipeetav tuleb ukse peale","variants":["- Ei, selleks toiminguks avatakse uks ja kinnipeetav tuleb ukse peale"],"status":"ok","src":"Tallinna Vangla kodukord (01.09.2026) p 19.7","note":"Erand: eraldi loaga võib ravimeid jagada ka läbi toiduluugi, näiteks agressiivse kinnipeetava puhul (kinnitanud Chris).","see":["UK28","UK29"],"kw":["Ei","avatakse uks"]}]}]},{"key":"LO","title":"Isiku ja objekti läbiotsimine","icon":"scan","color":"#ca8a04","subs":[{"name":"Eesmärk ja põhimõtted","questions":[{"id":"LO1","num":1,"q":"Mis on läbiotsimise eesmärk?","a":"Läbiotsimise eesmärk on leida keelatuid esemeid ja aineid ning tagada vangla turvalisus ja kord.\nLäbiotsimise eesmärk on avastada keelatud esemeid ja ennetada võimalikke julgeolekuohte.\n(tuvastada keelatud esemeid ja aineid, tagada vangla julgeolek)\nKeelatud esemete ja ainete avastamine; avastada peidik või varjatud käik; kontrollida ruumide tehnilist seisundit; kontrollida vangla vara tehnilist seisundit.","variants":["Läbiotsimise eesmärk on leida keelatuid esemeid ja aineid ning tagada vangla turvalisus ja kord.","Läbiotsimise eesmärk on avastada keelatud esemeid ja ennetada võimalikke julgeolekuohte.","(tuvastada keelatud esemeid ja aineid, tagada vangla julgeolek)","Keelatud esemete ja ainete avastamine; avastada peidik või varjatud käik; kontrollida ruumide tehnilist seisundit; kontrollida vangla vara tehnilist seisundit."],"status":"ok","src":"VangS § 68 lg 1; Slaidid „Isiku läbiotsimine“","note":"","see":["LO18","LO20","SA9"],"kw":["ennetada","avastada"]},{"id":"LO9","num":9,"q":"Milliseid põhimõtteid tuleb läbiotsimisel järgida?","a":"Läbiotsimine peab olema seaduslik, põhjalik ja turvaline ning seejuures tuleb austada inimese väärikust.","variants":["Läbiotsimine peab olema seaduslik, põhjalik ja turvaline ning seejuures tuleb austada inimese väärikust."],"status":"ok","src":"Slaidid „Isiku läbiotsimine“; Järelevalve korraldus vanglas (kehtiv 05.10.2026) § 31 lg 3¹","note":"","see":[],"kw":["Läbiotsimine","seaduslik","turvaline"]},{"id":"LO16","num":16,"q":"Miks ei ole põhjalik läbiotsimine märk usaldamatusest, vaid julgeolekumeede?","a":"Läbiotsimise eesmärk on ennetada keelatud esemete sattumist vanglasse ning kaitsta kõiki vanglas viibivaid isikuid.","variants":["Läbiotsimise eesmärk on ennetada keelatud esemete sattumist vanglasse ning kaitsta kõiki vanglas viibivaid isikuid."],"status":"unv","src":"","note":"Arutlusküsimus: vastus ei tulene otseselt normist.","see":[],"kw":["ennetada","Läbiotsimise","sattumist"]},{"id":"LO17","num":17,"q":"Kinnipeetav ütleb, et tema kapis olevaid esemeid pole vaja kontrollida, sest seal pole kunagi midagi keelatut leitud. Kas läbiotsimine võib siiski olla vajalik?","a":"Jah. Läbiotsimisi tehakse süsteemselt ja järjepidevalt, mitte ainult varasemate rikkumiste alusel.","variants":["Jah. Läbiotsimisi tehakse süsteemselt ja järjepidevalt, mitte ainult varasemate rikkumiste alusel."],"status":"ok","src":"Slaidid „Isiku läbiotsimine“","note":"","see":[],"kw":["järjepidevalt","Läbiotsimisi","süsteemselt"]},{"id":"LO18","num":18,"q":"Mis on isiku ja objekti läbiotsimise eesmärk?","a":"Eesmärk on leida keelatud või ohtlikke esemeid ning tagada vangla ja seal viibivate inimeste turvalisus.","variants":["Eesmärk on leida keelatud või ohtlikke esemeid ning tagada vangla ja seal viibivate inimeste turvalisus."],"status":"ok","src":"VangS § 68 lg 1","note":"","see":["LO1","LO20","SA9"],"kw":["turvalisus","viibivate","keelatud"]},{"id":"LO20","num":20,"q":"Mis on isiku läbiotsimise peamine eesmärk?","a":"Avastada keelatud esemed ja ained ning tagada turvalisus.","variants":["Avastada keelatud esemed ja ained ning tagada turvalisus."],"status":"ok","src":"VangS § 68 lg 1","note":"","see":["LO1","LO18","SA9"],"kw":["Avastada","turvalisus","keelatud"]},{"id":"LO21","num":21,"q":"Millised kolm põhimõtet on objekti läbiotsimisel olulised?","a":"Süstemaatilisus, põhjalikkus ja rahulikkus.","variants":["Süstemaatilisus, põhjalikkus ja rahulikkus."],"status":"ok","src":"Slaidid „Isiku läbiotsimine“","note":"","see":[],"kw":["Süstemaatilisus","põhjalikkus","rahulikkus"],"img":"objekt"},{"id":"LO23","num":23,"q":"Kas läbiotsimine on ainult öigus?","a":"- Ei teatud olukordades on see ka kohustus, nt vanglasse sisenemisel ja vanglast väljumisel;enne ja pärast lühiajalist ja pikaajalist kokkusaamist","variants":["- Ei teatud olukordades on see ka kohustus, nt vanglasse sisenemisel ja vanglast väljumisel;enne ja pärast lühiajalist ja pikaajalist kokkusaamist"],"status":"ok","src":"VangS § 68; Slaidid „Isiku läbiotsimine“; Järelevalve korraldus vanglas (kehtiv 05.10.2026) § 32","note":"","see":["LO5"],"kw":["kohustus"]}]},{"name":"Liigid ja kohustuslikud juhud","questions":[{"id":"LO2","num":2,"q":"Millisteks liikideks liigitatakse läbiotsimised?","a":"Läbiotsimine jaguneb plaaniliseks ja plaanivälise a ettekannet siis ta saab täpselt aru, mis juhtus, kus juhtus, kellega juhtus, mis kell, kuidas juhtus."],"status":"ok","src":"Slaidid „Kinnipeetava vanglasisene saatmine“","note":"Slaidi järgi annab ettekanne võimalikult täpse ülevaate sündmusest. Sekundi täpsust slaid ei nimeta.","see":[],"kw":["Nii täpselt kui võimalik","sekundi täpsusega"]},{"id":"SA11","num":11,"q":"Mis on ettekande eesmärk?","a":"Ettekanne annab juhile või teistele ametnikele ülevaate toimunud sündmusest, rikkumisest või muust olulisest asjaolust.","variants":["Ettekanne annab juhile või teistele ametnikele ülevaate toimunud sündmusest, rikkumisest või muust olulisest asjaolust."],"status":"ok","src":"Slaidid „Kinnipeetava vanglasisene saatmine“","note":"","see":["SA2","SA23"],"kw":["rikkumisest","ametnikele","sündmusest"]},{"id":"SA13","num":13,"q":"Kas ettekande koostaja peab olema vanglaametnik?","a":"Ei, nt. sotsiaaltöötajad, õpetajad jne. saavad ka ettekandeid koostada\n- Ei pea.Näiteks raamatu rikkumise või kaotamise korral koostab raamatukoguhoidja rikkumise toime pannud kinnipeetava kohta ettekande.","variants":["Ei, nt. sotsiaaltöötajad, õpetajad jne. saavad ka ettekandeid koostada","- Ei pea.Näiteks raamatu rikkumise või kaotamise korral koostab raamatukoguhoidja rikkumise toime pannud kinnipeetava kohta ettekande."],"status":"ok","src":"Slaidid „Kinnipeetava vanglasisene saatmine“","note":"","see":[],"kw":["Ei","raamatukoguhoidja"]},{"id":"SA16","num":16,"q":"Mida välditakse/ei kirjutata ettekandesse?","a":"välditakse emotsioone (va ähvardamine, solvamine), ei kirjutata arvamust ega oletust, ei kirjutata võimaliku rikutud õigusakti sätet.","variants":["välditakse emotsioone (va ähvardamine, solvamine), ei kirjutata arvamust ega oletust, ei kirjutata võimaliku rikutud õigusakti sätet."],"status":"ok","src":"Slaidid „Kinnipeetava vanglasisene saatmine“","note":"","see":[],"kw":["emotsioone","arvamust","oletust"]},{"id":"SA19","num":19,"q":"Miks peab ettekanne olema faktiline, mitte emotsionaalne?","a":"Ettekanne on ametlik dokument, mille alusel võidakse teha otsuseid. Seetõttu peab see põhinema kontrollitavatel asjaoludel, mitte arvamustel.","variants":["Ettekanne on ametlik dokument, mille alusel võidakse teha otsuseid. Seetõttu peab see põhinema kontrollitavatel asjaoludel, mitte arvamustel."],"status":"ok","src":"Slaidid „Kinnipeetava vanglasisene saatmine“","note":"","see":[],"kw":["kontrollitavatel","asjaoludel","arvamustel"]},{"id":"SA26","num":26,"q":"Millal tuleb koostada ettekanne, kui midagi juhtus?","a":"(esimesel võimalusel)","variants":["(esimesel võimalusel)"],"status":"ok","src":"Tallinna Vangla valvuri ametijuhend p 25; Slaidid „Kinnipeetava vanglasisene saatmine“","note":"","see":["SA5"],"kw":["esimesel võimalusel"]}]},{"name":"Teiste teemade küsimused","questions":[{"id":"SA6","num":6,"q":"Mida tehakse kinnipeetavaga pärast vahetu sunni kasutamist?","a":"Tervishoiutöötaja kontrollib esimesel võimalusel kinnipeetava terviseseisundit. Vahetu sunni kasutamise asjaolud ja kontrolli tulemus kantakse protokolli.","variants":["Tervishoiutöötaja kontrollib esimesel võimalusel kinnipeetava terviseseisundit. Vahetu sunni kasutamise asjaolud ja kontrolli tulemus kantakse protokolli."],"status":"fix","src":"VangS § 71 lg 7¹","note":"","see":["SA24"],"orig":"Kontrollitakse tema terviseseisundit ja tulemus kantakse protokolli (VangS § 71 lg 7¹).","why":"Täpsustatud, et terviseseisundit kontrollib tervishoiutöötaja ja protokolli kantakse ka sunni kasutamise asjaolud.","kw":["Tervishoiutöötaja","esimesel võimalusel"]},{"id":"SA7","num":7,"q":"Kas töötõendi esitamine politseile on ok kui puuduvad kõik teised dokumendid ning ületasid ainult 7km/h üle piir kiiruse?","a":"Ei","variants":["Ei"],"status":"ok","src":"Slaidid „SKA sisekontrolli tööpõhimõtted“","note":"Töötõendi esitamine politseiametnikule on slaidil toodud 2025. aasta rikkumiste näidetes.","see":[],"kw":["Ei"]},{"id":"SA8","num":8,"q":"Miks me otsime kinnipeetavaid saatmisel läbi?","a":"Vangla turvalisuse tagamiseks kui ka iseenda.","variants":["Vangla turvalisuse tagamiseks kui ka iseenda."],"status":"ok","src":"Slaidid „Isiku läbiotsimine“","note":"Slaid: läbiotsimine on üks meetmetest, mis aitab kaasa julgeoleku tagamisele.","see":["LO7"],"kw":["turvalisuse","iseenda"]},{"id":"SA9","num":9,"q":"Miks me otsime objekte läbi?","a":"Vangla turvalisuse tagamiseks kui ka iseenda.","variants":["Vangla turvalisuse tagamiseks kui ka iseenda."],"status":"ok","src":"Slaidid „Isiku läbiotsimine“","note":"Slaid: läbiotsimine on üks meetmetest, mis aitab kaasa julgeoleku tagamisele.","see":["LO1","LO18","LO20"],"kw":["turvalisuse","iseenda"]},{"id":"SA12","num":12,"q":"Milliseid põhimõtteid tuleb vahetu sunni kasutamisel järgida?","a":"Sund peab olema õiguspärane, vajalik ja vastama ohu suurusele ehk olema proportsionaalne.","variants":["Sund peab olema õiguspärane, vajalik ja vastama ohu suurusele ehk olema proportsionaalne."],"status":"ok","src":"Slaidid „Jõu kasutamine“","note":"","see":["VS10","VS17"],"kw":["õiguspärane","vajalik","proportsionaalne"]},{"id":"SA17","num":17,"q":"Mida tähendab vahetu sunni kasutamine?","a":"vahetu sunni kasutamine tähendab mõjutamist füüsilise jõu, erivahendi (nt teenistuslooma) või teenistusrelvaga.","variants":["vahetu sunni kasutamine tähendab mõjutamist füüsilise jõu, erivahendi (nt teenistuslooma) või teenistusrelvaga."],"status":"ok","src":"VangS § 71 lg 3³; Slaidid „Jõu kasutamine“","note":"","see":["VS5","VS16"],"kw":["füüsilise jõu","erivahendi","teenistusrelvaga"]},{"id":"SA20","num":20,"q":"Miks peab ametnik enne vahetu sunni kasutamist kaaluma leebemaid meetmeid?","a":"Vahetu sund on erandlik meede ning seda võib kasutada ainult siis, kui eesmärki ei ole võimalik saavutada leebemate vahenditega.","variants":["Vahetu sund on erandlik meede ning seda võib kasutada ainult siis, kui eesmärki ei ole võimalik saavutada leebemate vahenditega."],"status":"ok","src":"VangS § 71 lg 1; Slaidid „Jõu kasutamine“","note":"","see":["VS8"],"kw":["vahenditega","saavutada","leebemate"]},{"id":"SA21","num":21,"q":"Kaks ametnikku saavutavad sama tulemuse erinevalt: üks kasutab põhjendamatult jõudu, teine lahendab olukorra suhtlemisega. Milline neist tegutseb õiguspärasemalt?","a":"Õiguspärasemalt tegutseb ametnik, kes saavutab eesmärgi kõige vähem piirava meetmega, järgides seaduslikkuse ja proportsionaalsuse põhimõtteid.","variants":["Õiguspärasemalt tegutseb ametnik, kes saavutab eesmärgi kõige vähem piirava meetmega, järgides seaduslikkuse ja proportsionaalsuse põhimõtteid."],"status":"ok","src":"Slaidid „Jõu kasutamine“","note":"","see":[],"kw":["kõige vähem piirava","proportsionaalsuse"]},{"id":"SA22","num":22,"q":"Miks võib vahetu sunni kasutamine olla seaduslik, kuid siiski vajada hilisemat kontrolli?","a":"Iga vahetu sunni kasutamise juhtumit tuleb hinnata, et kontrollida selle seaduslikkust, vajalikkust ja proportsionaalsust ning teha kindlaks, kas ametnik tegutses õigesti.","variants":["Iga vahetu sunni kasutamise juhtumit tuleb hinnata, et kontrollida selle seaduslikkust, vajalikkust ja proportsionaalsust ning teha kindlaks, kas ametnik tegutses õigesti."],"status":"ok","src":"Slaidid „Jõu kasutamine“","note":"","see":[],"kw":["seaduslikkust","vajalikkust","proportsionaalsust"]},{"id":"SA24","num":24,"q":"Mida peab ametnik tegema pärast vahetu sunni kasutamist?","a":"Ametnik peab hindama võimalikke tervisekahjustusi, korraldama vajaduse korral abi, teavitama juhtunust kehtestatud korras ja vormistama dokumendi.","variants":["Ametnik peab hindama võimalikke tervisekahjustusi, korraldama vajaduse korral abi, teavitama juhtunust kehtestatud korras ja vormistama dokumendi."],"status":"ok","src":"VangS § 71 lg 7¹; Slaidid „Jõu kasutamine“","note":"","see":["SA6"],"kw":["tervisekahjustusi","kehtestatud","võimalikke"]}]}]},{"key":"VS","title":"Vahetu sunni kasutamine","icon":"shield","color":"#dc2626","subs":[{"name":"Mõiste ja põhimõtted","questions":[{"id":"VS4","num":4,"q":"Kui kinnipeetav käitub agressiivselt, kas rahustusvoodi kasutamine on alati parim lahendus? Miks või miks mitte?","a":"Ei, sest jõu- ja ohjeldusmeetme valikul tuleb hinnata tegelikku ohtu ning valida sobiv ja proportsionaalne meede. Rahustusvoodi piirab inimese põhiõigusi kõige rohkem ning seda ei tohi kasutada karistamiseks.","variants":["Ei, sest jõu- ja ohjeldusmeetme valikul tuleb hinnata tegelikku ohtu ning valida sobiv ja proportsionaalne meede. Rahustusvoodi piirab inimese põhiõigusi kõige rohkem ning seda ei tohi kasutada karistamiseks."],"status":"ok","src":"Slaidid „Jõu kasutamine“","note":"","see":[],"kw":["Ei","proportsionaalne","karistamiseks"],"img":"voodi"},{"id":"VS5","num":5,"q":"Mis on vahetu sund?","a":"Isiku, looma või asja mõjutamine füüsilise jõu, erivahendi või relvaga (KorS § 74 lg 1).\nVahetu sund on isiku mõjutamine füüsilise jõu, erivahendi või teenistusrelvaga.","variants":["Isiku, looma või asja mõjutamine füüsilise jõu, erivahendi või relvaga (KorS § 74 lg 1).","Vahetu sund on isiku mõjutamine füüsilise jõu, erivahendi või teenistusrelvaga."],"status":"ok","src":"KorS § 74 lg 1; Slaidid „Jõu kasutamine“","note":"","see":["SA17","VS16"],"kw":["füüsilise jõu","erivahendi","relvaga"]},{"id":"VS8","num":8,"q":"Millal võib vanglateenistuja kasutada vahetut sundi?","a":"Vahetut sundi võib kasutada siis, kui see on seadusega lubatud ja vajalik ohu tõrjumiseks või korra taastamiseks.","variants":["Vahetut sundi võib kasutada siis, kui see on seadusega lubatud ja vajalik ohu tõrjumiseks või korra taastamiseks."],"status":"unv","src":"","note":"Arutlusküsimus: vastus ei tulene otseselt normist.","see":["SA20"],"kw":["taastamiseks","tõrjumiseks","seadusega"]},{"id":"VS10","num":10,"q":"Miks on oluline jõu kasutamise proportsionaalsus?","a":"Jõu kasutamine võib seada ohtu kinnipeetava elu, samuti võib ebaproportsionaalne jõu kasutamine olla üheks väärkohtlemise viisiks.","variants":["Jõu kasutamine võib seada ohtu kinnipeetava elu, samuti võib ebaproport alikult ohutult nurga alt; maha viimise põhilised suunad – ette ja tahapoole.","variants":["kõik põhimotted- korraldused – võimalusel eelnev hoiatamine füüsilise jõu kasutamise eest; distants – vastase suhtes hoitakse ohutut distantsi; keha asend – jalad kergelt kõverdunud, selg sirge, keha poolpöördes vastase poole, käed nn valmisolekuasendis; liikumine – vastasele lähenemine peab toimuma võimalikult ohutult nurga alt; maha viimise põhilised suunad – ette ja tahapoole."],"status":"ok","src":"Slaidid „Jõu kasutamine“","note":"","see":["VS2","VS23"],"kw":["korraldused","distants","keha asend","liikumine"]},{"id":"VS14","num":14,"q":"Mitu valupunkti asub inimese näos?","a":"5 enam kasutatavat valupunkti näos.","variants":["5 enam kasutatavat valupunkti näos."],"status":"fix","src":"Kinnitanud Chris","note":"Väljaõppe standard nimetab enim kasutatavate valupunktidena kõrvanibu alust, nina alust, põsesarna alust ja kaelaalust piirkonda.","see":[],"kw":["5","valupunkti"],"orig":"5","why":"Chris täpsustas: küsimus on enam kasutatavate valupunktide kohta."},{"id":"VS18","num":18,"q":"Kui kinnipeetav on agressiivne ega allu korraldustele, mida tuleks teha enne füüsilise jõu kasutamist ning kui kasutada füüsilist jõudu, mida selle all peetakse silmas?","a":"(Anda korraldusi 2-3x, füüsilise jõu kasutamine - võtete/tehnikat esooritamine, et kinnipeetav kontrolli alla saada)","variants":["(Anda korraldusi 2-3x, füüsilise jõu kasutamine - võtete/tehnikat esooritamine, et kinnipeetav kontrolli alla saada)"],"status":"ok","src":"Slaidid „Jõu kasutamine“","note":"Korraldused ja võtete sooritamine on slaidil. Korralduste kordamist 2–3 korda slaid ei nimeta.","see":[],"kw":["korraldusi 2-3x","kontrolli alla"]},{"id":"VS22","num":22,"q":"Mis on füüsilise jõu kasutamise eesmärgiks?","a":"Füüsilise jõu kasutamise eesmärgiks on kas allumatuse korral sundida vangi korraldust täitma või ründe korral agressiivse isiku kontrolli alla saamine, millega lõpetatakse/peatatakse ohtlik tegevus. Oluline on kontroll vastase üle, mitte talle üleliigse valu või kahju tekitamine.","variants":["Füüsilise jõu kasutamise eesmärgiks on kas allumatuse korral sundida vangi korraldust täitma või ründe korral agressiivse isiku kontrolli alla saamine, millega lõpetatakse/peatatakse ohtlik tegevus. Oluline on kontroll vastase üle, mitte talle üleliigse valu või kahju tekitamine."],"status":"ok","src":"Slaidid „Jõu kasutamine“","note":"","see":[],"kw":["kontrolli alla","korraldust täitma"]},{"id":"VS23","num":23,"q":"Millised on üldpõhimõtted füüsilise jõu kasutamisel?","a":"Korraldused – võimalusel eelnev hoiatamine füüsilise jõu kasutamise eest. Korralduste andmine eesmärgi saavutamiseks läbivalt võtete sooritamise käigus;","variants":["Korraldused – võimalusel eelnev hoiatamine füüsilise jõu kasutamise eest. Korralduste andmine eesmärgi saavutamiseks läbivalt võtete sooritamise käigus;"],"status":"ok","src":"Slaidid „Jõu kasutamine“","note":"","see":["VS2","VS13"],"kw":["Korraldused","hoiatamine"]}]},{"name":"Erivahendid, relvad ja ohjeldusmeetmed","questions":[{"id":"VS1","num":1,"q":"Milliseid ohjeldusmeetmeid võib vanglas kasutada?","a":"Käe – ja jalarauad, sidumisvahendid, rahustussärk, rahustustool, rahustusvoodi","variants":["Käe – ja jalarauad, sidumisvahendid, rahustussärk, rahustustool, rahustusvoodi"],"status":"ok","src":"VangS § 70¹ lg 1 p 1; Slaidid „Jõu kasutamine“","note":"","see":["VS6","VS21"],"kw":["jalarauad","sidumisvahendid","rahustussärk","rahustusvoodi"],"img":"raud"},{"id":"VS3","num":3,"q":"Mis abivahendid on vahetu sunni abistamiseks ametniku erivahendite vööl lubatud?","a":"Gaas, teleskoopnui, käerauad ja elektrishokirelv","variants":["Gaas, teleskoopnui, käerauad ja elektrishokirelv"],"status":"ok","src":"Kinnitanud Chris","note":"Elektrišokirelv on vööl neil ametnikel, kes on läbinud vastava väljaõppe. Vanglas on see tavaline.","see":[],"kw":["Gaas","teleskoopnui","käerauad","elektrishokirelv"]},{"id":"VS6","num":6,"q":"Nimeta 3 erivahendit, m async function loadRemote(){if(!REMOTE.on)return;try{
  const r=await fetch(SUPABASE_URL+"/rest/v1/parandused?select=id,question_id,name,text,note,status,created_at&order=created_at.asc",{headers:sbHeaders()});

async function sb(path,opt){const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,Object.assign({headers:sbHeaders(opt&&opt.prefer?{"Prefer":opt.prefer}:null)},opt||{}));if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e}const t=await r.text();return t?JSON.parse(t):null}
async function toggleVote(rid){if(!S.user){openLogin("Hääletamiseks loo kasutaja või logi sisse. Selleks on vaja ainult nime.");return}

async function pushSync(keep){if(!S.user||!REMOTE.on)return;try{await fetch(SUPABASE_URL+"/rest/v1/kasutajad?id=eq."+S.user.id,{method:"PATCH",keepalive:!!keep,headers:sbHeaders({"Prefer":"return=minimal"}),body:JSON.stringify({xp:S.xp,best:S.best,progress:{q:S.q,days:S.days},updated_at:new Date().toISOString()})})}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&S.user){clearTimeout(syncT);pushSync(true)}});
function mergeRemote(row){const rp=row.progress||{},rq=rp.q||{},out=Object.assign({},S.q);
  Object.entries(rq).forEach(([id,r])=>{const l=out[id];if(!l){out[id]=r;return}const later=(r.ts||0)>(l.ts||0)?r:l;
    out[id]={r:Math.max(l.r||0,r.r||0),p:Math.max(l.p||0,r.p||0),w:Math.max(l.w||0,r.w||0),last:later.last,ts:Math.max(l.ts||0,r.ts||0)}});
  S.q=out;const d=Object.assign({},S.days);Object.entries(rp.days||{}).forEach(([k,v])=>{d[k]=Math.max(d[k]||0,v)});S.days=d;
  S.xp=Math.max(S.xp||0,row.xp||0);S.best=Math.max(S.best||0,row.best||0)}
const nameKey=n=>n.trim().toLowerCase();
async function findUser(name){const rows=await sb(`kasutajad?select=id,name,xp,best,progress&name_key=eq.${encodeURIComponent(nameKey(name))}`);return rows&&rows[0]||null}
function doLogin(row,isNew){mergeRemote(row);S.user={id:row.id,name:row.name};S.name=row.name;save();pushSync(false);updateUserBtn();COURSE.ts=0;
  if(current==="opi"&&!session)renderHome();else rerender();toast(isNew?"Kasutaja loodud. Tere, "+row.name+"!":"Tere, "+row.name+"!")}
async function restoreUser(){if(!S.user||!REMOTE.on)return;try{const rows=await sb(`kasutajad?select=id,name,xp,best,progress&id=eq.${S.user.id}`);
  if(rows&&rows[0]){mergeRemote(rows[0]);S.user.name=rows[0].name;save();updateUserBtn();if(current==="opi"&&!session)renderHome()}else{S.user=null;save();updateUserBtn()}}catch(e){}}
function updateUserBtn(){const b=document.getElementById("userBtn");if(!b)return;const ic=svg('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>');
  b.classList.toggle("on",!!S.user);b.innerHTML=ic+`<span>${S.user?esc(S.user.name):"Kasutaja"}</span>`;b.setAttribute("aria-label",S.user?"Kasutaja "+S.user.name:"Loo kasutaja või logi sisse")}
function openLogin(reason){
  if(S.user){const s=sheet(`<button class="iconbtn close" data-close aria-label="Sulge">✕</button><h2>${esc(S.user.name)}</h2>
    <p class="muted" style="margin:.4rem 0 0">Oled sisse logitud. Sinu XP, statistika ja raskeimad küsimused salvestuvad ning on alles ka teises seadmes, kui logid seal sisse sama nimega.</p>
    <div class="loginnote">Teises seadmes sisselogimiseks on vaja ainult nime: ${esc(S.user.name)}</div>
    <div style="display:flex;gap:10px;margin-top:14px;justify-content:flex-end"><button class="btn ghost" id="lgOut">Logi välja</button><button class="btn primary" data-close>Sulge</button></div>`);
    $("#lgOut",s).onclick=async()=>{clearTimeout(syncT);await pushSync(false);const keep={theme:S.theme,goal:S.goal};S=blank();S.theme=keep.theme;S.goal=keep.goal;save();s.remove();updateUserBtn();session=null;go(current);toast("Logisid välja. Sinu edenemine on salvestatud.")};return}
  let mode=reason&&/hääleta/i.test(reason)?"login":"new";
  const s=sheet(`<button class="iconbtn close" data-close aria-label="Sulge">✕</button><h2>Kasutaja</h2>
    ${reason?`<p class="muted" style="margin:.4rem 0 0">${esc(reason)}</p>`:""}
    <div class="loginnote">Kasutaja tegemiseks ja sisselogimiseks on vaja ainult nime. Parooli ei ole.</div>
    <div class="chips" role="tablist" style="margin-top:14px"><button class="chip" id="tabNew" role="tab">Loo uus kasutaja</button><button class="chip" id="tabLogin" role="tab">Mul on juba kasutaja</button></div>
    <div class="fld"><label class="lbl2" for="lgName" id="lgLbl">Sinu nimi</label><input id="lgName" autocomplete="name" placeholder="Ees- ja perekonnanimi" value="${esc(S.name||"")}"></div>
    <div id="lgMsg" class="src" style="margin-top:8px;min-height:1.2em"></div>
    <div style="display:flex;gap:10px;margin-top:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn ghost" data-close>Tühista</button><button class="btn primary" id="lgGo"></button></div>
    <p class="src" id="lgHelp" style="margin:14px 0 0"></p>`);
  const inp=$("#lgName",s),msg=$("#lgMsg",s),go2=$("#lgGo",s),help=$("#lgHelp",s);
  const setMode=m=>{mode=m;$("#tabNew",s).setAttribute("aria-pressed",m==="new");$("#tabLogin",s).setAttribute("aria-pressed",m==="login");msg.textContent="";go2.disabled=false;
    go2.textContent=m==="new"?"Loo kasutaja":"Logi sisse";
    help.textContent=m==="new"?"Vali nimi, mida keegi teine kursusel ei kasuta, näiteks ees- ja perekonnanimi. Sinu nimi ja XP on näha edetabelis. Kuna parooli ei ole, saab sinu nimega sisse logida igaüks, kes seda nime teab."
      :"Kirjuta sama nimi, millega kasutaja tegid. Suured ja väikesed tähed ei loe. Sinu XP, statistika ja raskeimad küsimused tulevad kaasa.";inp.focus()};
  $("#tabNew",s).onclick=()=>setMode("new");$("#tabLogin",s).onclick=()=>setMode("login");setMode(mode);
  if(!REMOTE.on){msg.textContent="Ühine andmebaas pole sellel lehel seadistatud, seega kasutajat teha ei saa.";go2.disabled=true;return}
  const clean=()=>inp.value.trim().replace(/\s+/g," ");
  const check=name=>{if(name.length<2){msg.textContent="Nimi peab olema vähemalt 2 tähemärki.";inp.focus();return false}if(name.length>40){msg.textContent="Nimi võib olla kuni 40 tähemärki.";return false}return true};
  const create=async name=>{go2.disabled=true;msg.textContent="Loon kasutajat…";
    try{const rows=await sb("kasutajad",{method:"POST",prefer:"return=representation",body:JSON.stringify({name})});s.remove();doLogin(rows[0],true)}
    catch(e){go2.disabled=false;if(e.status===409){msg.innerHTML=`Nimi „${esc(name)}“ on juba olemas. Kui see oled sina, vali „Mul on juba kasutaja“. Muidu vali teine nimi.`}
      else msg.textContent="Kasutaja tegemine ei õnnestunud. Kontrolli internetiühendust ja proovi uuesti."}};
  const login=async name=>{go2.disabled=true;msg.textContent="Otsin…";
    try{const u=await findUser(name);if(u){s.remove();doLogin(u,false);return}
      go2.disabled=false;msg.innerHTML=`Kasutajat „${esc(name)}“ ei ole. <button class="btn small accent" id="lgMk" style="margin-left:6px">Loo see kasutaja</button>`;
      $("#lgMk",s).onclick=()=>{setMode("new");inp.value=name;create(name)}}
    catch(e){go2.disabled=false;msg.textContent="Andmebaasiga ei saanud ühendust. Proovi hiljem uuesti."}};
  go2.onclick=()=>{const name=clean();if(!check(name))return;mode==="new"?create(name):login(name)};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")go2.click()})}
/* --- kursus: edetabel ja raskeimad --- */
const COURSE={lb:null,stat:null,ts:0,err:false};
async function loadCourse(){if(!REMOTE.on){fillCourse();return}if(Date.now()-COURSE.ts<30000&&COURSE.lb){fillCourse();return}
  try{const [a,b]=await Promise.all([sb("kasutajad?select=id,name,xp&order=xp.desc,name.asc&limit=20"),sb("kysimuste_stat?select=question_id,teadis,osaliselt,ei_teadnud")]);
    COURSE.lb=a||[];COURSE.stat=b||[];COURSE.ts=Date.now();COURSE.err=false}catch(e){COURSE.err=true}fillCourse()}
function courseHard(){return (COURSE.stat||[]).map(x=>{const n=x.teadis+x.osaliselt+x.ei_teadnud;return {q:BY[x.question_id],n,bad:n?(x.ei_teadnud+x.osaliselt*.5)/n:0}}).filter(x=>x.q&&x.n>=3&&x.bad>0).sort((a,b)=>b.bad-a.bad||b.n-a.n).slice(0,10)}
function fillCourse(){const lb=document.getElementById("lbPanel"),cr=document.getElementById("crsPanel");if(!lb||!cr)return;
  const off=!REMOTE.on||COURSE.err;const offTxt=`<div class="empty">${REMOTE.on?"Andmebaasiga ei saanud ühendust.":"Ühine andmebaas pole sellel lehel seadistatud."}</div>`;
  lb.innerHTML=`<h3 style="font-size:1.05rem;margin-bottom:10px">Edetabel</h3>`+(off?offTxt:!COURSE.lb?`<div class="empty">Laen…</div>`:
    (COURSE.lb.length?`<ol class="lb">${COURSE.lb.map(u=>S.user&&u.id===S.user.id?{...u,xp:Math.max(u.xp,S.xp)}:u).sort((a,b)=>b.xp-a.xp).map((u,i)=>`<li class="${S.user&&u.id===S.user.id?"me":""}"><span class="rk">${i+1}.</span><span class="nm">${esc(u.name)}</span><span class="xp">${u.xp} XP</span></li>`).join("")}</ol>`:`<div class="empty">Edetabel on veel tühi.</div>`)+
    (S.user?(COURSE.lb.some(u=>u.id===S.user.id)?"":`<div class="src" style="margin-top:8px">Sinu XP: ${S.xp}</div>`):`<button class="btn small" id="lbLogin" style="margin-top:12px">Loo kasutaja, et olla edetabelis</button><div class="src" style="margin-top:6px">Kasutaja tegemiseks on vaja ainult nime.</div>`));
  const h=courseHard();
  cr.innerHTML=`<h3 style="font-size:1.05rem;margin-bottom:10px">Kursuse raskeimad küsimused</h3>`+(off?offTxt:!COURSE.stat?`<div class="empty">Laen…</div>`:
    (h.length?`<ol class="hardlist">${h.map(x=>`<li><span class="cnt">${Math.round(x.bad*100)}%</span><span>${esc(x.q.q)} <span class="src">· ${esc(TOP[x.q.t].short)} · ${x.n} vastust</span></span></li>`).join("")}</ol><button class="btn small" id="drillCourse" style="margin-top:12px">Harjuta neid</button>`
    :`<div class="empty">Siia ilmuvad küsimused, mida kogu kursus kõige rohkem valesti vastab. Küsimus jõuab nimekirja, kui sellele on vastatud vähemalt 3 korda.</div>`))+
    `<div class="src" style="margin-top:8px">% näitab, kui suur osa kõigi vastustest oli vale (osaliselt = pool).</div>`;
  const ll=document.getElementById("lbLogin");if(ll)ll.onclick=()=>openLogin();
  const dc=document.getElementById("drillCourse");if(dc)dc.onclick=()=>openModes(h.map(x=>x.q),"Kursuse raskeimad")}

async function sendRemote(f){const r=await fetch(SUPABASE_URL+"/rest/v1/parandused",{method:"POST",headers:sbHeaders({"Prefer":"return=representation"}),body:JSON.stringify({question_id:f.id,name:f.name,text:f.text,note:f.note||null})});
  if(!r.ok)throw new Error("HTTP "+r.status);try{const j=await r.json();return j&&j[0]&&j[0].id}catch(e){return null}}
function rerender(){if(current==="koik")drawAll();else if(current==="muudatused")renderChanges()}

/* ---------- storage ---------- */
const KEY="vangla-kordamine-v1";
function blank(){return{q:{},xp:0,days:{},best:0,reports:[],fixes:[],name:"",goal:30,theme:null,user:null}}
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw){S=Object.assign(blank(),JSON.parse(raw));}}catch(e){}
if(!Array.isArray(S.fixes))S.fixes=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}if(S.user&&typeof scheduleSync==="function")scheduleSync()}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function streak(){let n=0;const d=new Date();if(!S.days[today()])d.setDate(d.getDate()-1);
  for(;;){const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(S.days[k]>0){n++;d.setDate(d.getDate()-1)}else break}return n}
const st=id=>S.q[id]||{r:0,p:0,w:0,last:null};
function mastery(id){const s=S.q[id];if(!s||!s.last)return 0;return s.last==="yes"?1:s.last==="part"?.5:0}
function levelOf(xp){let i=0;LEVELS.forEach((l,k)=>{if(xp>=l[0])i=k});return i}

/* ---------- theme ---------- */
const root=document.documentElement;
function applyTheme(){if(S.theme)root.setAttribute("data-theme",S.theme);else root.removeAttribute("data-theme");
  const dark=S.theme?S.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  document.getElementById("themeBtn").innerHTML=dark?svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'):svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>');}

/* ---------- helpers ---------- */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function ranges(text,terms,cls){const low=text.toLowerCase();const out=[];
  terms.forEach((t,ti)=>{if(!t)return;const tl=t.toLowerCase();let i=0;while((i=low.indexOf(tl,i))>=0){out.push([i,i+tl.length,typeof cls==="function"?cls(ti):cls]);i+=tl.length;}});
  out.sort((a,b)=>a[0]-b[0]||b[1]-a[1]);const m=[];out.forEach(r=>{if(!m.length||r[0]>=m[m.length-1][1])m.push(r)});return m}
function hl(text,terms,cls="kw"){const rs=ranges(text,terms,cls);let h="",p=0;rs.forEach(([a,b,c])=>{h+=esc(text.slice(p,a))+`<mark class="${c}">`+esc(text.slice(a,b))+"</mark>";p=b});return h+esc(text.slice(p))}
function ansHTML(q,terms,cls){const vs=q.variants;
  if(vs.length<=1)return `<div class="ans">${hl(q.a,terms||q.kw,cls)}</div>`;
  return `<div class="ans">${vs.map((v,i)=>`<span class="var"><span class="varlbl">Vastus ${i+1}</span>${hl(v,terms||q.kw,cls)}</span>`).join("")}</div>`}
function shortAns(q){let a=q.variants[0].replace(/^[-–\s(]+|[)\s]+$/g,"").replace(/\s+/g," ").trim();
  const m=a.match(/^(.{25,}?[.!?])\s/);if(m&&m[1].length<a.length)a=m[1];if(a.length>105)a=a.slice(0,102).replace(/\s\S*$/,"")+"…";return a}
const norm=s=>s.toLowerCase().replace(/õ/g,"o").replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/š/g,"s").replace(/ž/g,"z").replace(/[^a-z0-9+°\s]/g," ").replace(/\s+/g," ").trim();
function kwHit(user,kw){const u=" "+norm(user)+" ";const words=norm(kw).split(" ").filter(Boolean);if(!words.length)return false;
  return words.every(w=>{if(/^\d/.test(w)||w.length<=3)return new RegExp("(^|\\D)"+w.replace(/[+]/g,"\\+")+"(\\D|$)").test(u)||u.includes(" "+w+" ");const stem=w.slice(0,Math.max(4,Math.min(w.length-2,7)));return u.includes(stem)})}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
async function copyText(txt,el){try{await navigator.clipboard.writeText(txt);toast("Kopeeritud");}catch(e){
  const ta=document.createElement("textarea");ta.value=txt;ta.style.cssText="width:100%;min-height:200px;margin-top:10px";ta.readOnly=true;(el||document.body).appendChild(ta);ta.select();toast("Vali tekst ja kopeeri käsitsi");}}
function badge(q,clickable){

  if(q.status==="ok")return `<span class="badge b-ok">✓ kontrollitud</span>`;
  return `<span class="badge b-unv">⚠ kontrollimata</span>`}
function peopleHTML(q){if(!q.people||!q.people.length)return "";return `<div class="people"><div class="who">Keda tean, kes seda kannab</div><ul>${q.people.map(p=>`<li>${p.name?`<b>${esc(p.name)}</b> – `:""}${esc(p.role)} <span class="src">(${esc(p.src)})</span></li>`).join("")}</ul></div>`}
function addBadge(q){return q.added?`<span class="badge b-add">➕ lisatud</span>`:""}
function proposals(q){const c=(q.community||[]).map(x=>({...x,mine:false})).sort((a,b)=>vcount(b.rid)-vcount(a.rid)),m=S.fixes.filter(f=>f.id===q.id).map(x=>({...x,mine:true}));return [...c,...m]}
function stLabel(p){return p.mine?`<span class="badge b-unv">📱 ainult sinu seadmes</span>`:""}
function cfixHTML(q){const ps=proposals(q);if(!ps.length)return "";
  return `<div class="cfix"><div class="row"><span class="who">Veebilehel olev vastus</span><span class="txt">${esc(q.a)}</span></div>${ps.map(p=>`<div class="row ${p.mine?"own":""}"><span class="who">${esc(p.name||"Nimetu")} – parandatud vastus ${stLabel(p)}</span><span class="txt">${esc(p.text)}</span>${p.note?`<span class="nt">Põhjus / allikas: ${esc(p.note)}</span>`:""}${p.rid?`<button class="vote" data-vote="${p.rid}" aria-pressed="${voted(p.rid)}">👍 Nõustun · ${vcount(p.rid)}</button>`:""}</div>`).join("")}</div>`}
function diffHTML(q){return `<div class="diff"><div class="lbl">Algne vastus</div><div class="old">${esc(q.orig)}</div><div class="lbl">Uus vastus</div><div class="new">${esc(q.a)}</div><div><b>Miks:</b> ${esc(q.why)}</div><div class="src"><b>Allikas:</b> ${esc(q.src)}</div></div>`}

const PAGES={opi:"page-opi",koik:"page-all",muudatused:"page-ch"};
let current="opi",session=null;

function ringHTML(pct){const C=2*Math.PI*24;return `<div class="ring"><svg viewBox="0 0 60 60"><circle class="tr" cx="30" cy="30" r="24" fill="none" stroke-width="6"/><circle class="fg" cx="30" cy="30" r="24" fill="none" stroke-width="6" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C*(1-pct)}"/></svg><b>${Math.round(pct*100)}%</b></div>`}

      <div class="panel kpi"><b>${learned}</b><span>õpitud küsimust / ${QS.length}</span></div>
      <div class="panel kpi"><b>${streak()}🔥</b><span>päeva järjest</span></div>
      <div class="panel kpi"><b>${tdy}/${S.goal}</b><span>tänane eesmärk</span><div class="goalbar"><i style="width:0" data-w="${Math.min(100,tdy/S.goal*100)}%"></i></div></div>
    </div>
  </div>
